<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉他谱弹唱阅读器</title>
<style>
/* ==================== 基础重置与变量 ==================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ==================== 皮肤主题变量 ==================== */
/* 暗夜（默认） */
:root{
  --bg:#0d1117;--surface:#161b22;--surface-2:#21262d;--surface-3:#30363d;
  --border:#30363d;--text:#e6edf3;--text-muted:#8b949e;--text-dim:#6e7681;
  --primary:#58a6ff;--primary-hover:#79b8ff;--primary-dim:rgba(88,166,255,.15);
  --danger:#f85149;--warning:#d29922;--success:#3fb950;--star:#ffa657;
  --page-bg:#1a1a1a;--display-bg:#000;
  --radius:8px;--radius-sm:4px;--sidebar-w:280px;--toolbar-h:48px;
  --statusbar-h:40px;--transition:.2s ease;
}
/* 护眼绿 */
[data-theme="green"]{
  --bg:#1a2e1a;--surface:#1f3a1f;--surface-2:#2a4a2a;--surface-3:#3a5a3a;
  --border:#3a5a3a;--text:#d4e8d4;--text-muted:#8aaa8a;--text-dim:#6a8a6a;
  --primary:#66cc66;--primary-hover:#88dd88;--primary-dim:rgba(102,204,102,.15);
  --danger:#e07070;--warning:#d4a843;--success:#5cb85c;--star:#e8a847;
  --page-bg:#223322;--display-bg:#0a1a0a;
}
/* 羊皮纸（亮色） */
[data-theme="parchment"]{
  --bg:#f5f0e1;--surface:#ede5d0;--surface-2:#e0d5b8;--surface-3:#d0c4a0;
  --border:#c0b090;--text:#3a3020;--text-muted:#6a5d40;--text-dim:#8a7d60;
  --primary:#8b6914;--primary-hover:#a87d20;--primary-dim:rgba(139,105,20,.12);
  --danger:#c0392b;--warning:#d4a843;--success:#27ae60;--star:#e8a847;
  --page-bg:#fffaf0;--display-bg:#e8dfc8;
}
/* 高对比深蓝 */
[data-theme="ocean"]{
  --bg:#0a1628;--surface:#102038;--surface-2:#1a3050;--surface-3:#244068;
  --border:#2a4a70;--text:#e0e8f0;--text-muted:#8aa0b8;--text-dim:#6a8098;
  --primary:#00d4ff;--primary-hover:#40e0ff;--primary-dim:rgba(0,212,255,.15);
  --danger:#ff5050;--warning:#ffcc00;--success:#00ff88;--star:#ffaa00;
  --page-bg:#0d1f36;--display-bg:#050d1a;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* ==================== 主布局 ==================== */
#app{display:flex;height:100vh;width:100vw}
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  transition:width var(--transition),min-width var(--transition);overflow:hidden;
}
#sidebar.collapsed{width:0;min-width:0;border-right:none}
/* 移动端侧栏浮层遮罩（桌面端始终隐藏） */
#sidebar-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;
}
#sidebar-backdrop.show{display:block}
#main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ==================== 侧栏 ==================== */
.sidebar-header{padding:12px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:16px;font-weight:600;margin-bottom:8px}
.search-box input{
  width:100%;padding:6px 10px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);
}
.search-box input:focus{outline:none;border-color:var(--primary)}
.sidebar-controls{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
#sort-select{
  padding:4px 8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);cursor:pointer;
}
.tag-bar{display:flex;flex-wrap:wrap;gap:4px}
.tag-chip{
  padding:2px 8px;font-size:11px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:12px;cursor:pointer;
  transition:all var(--transition);color:var(--text-muted);
}
.tag-chip:hover{border-color:var(--primary)}
.tag-chip.active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
#song-list{flex:1;overflow-y:auto;padding:4px 0}
.song-item{
  padding:8px 12px;cursor:pointer;border-left:3px solid transparent;
  transition:background var(--transition);display:flex;align-items:center;gap:8px;
}
.song-item:hover{background:var(--surface-2)}
.song-item.active{background:var(--primary-dim);border-left-color:var(--primary)}
.song-item .song-info{flex:1;min-width:0}
.song-item .song-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-item .song-meta{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-item .song-pages{font-size:11px;color:var(--text-dim);flex-shrink:0}
/* 通用星标按钮（工具栏的 #current-star 也复用它，之前只有列表内的选择器，工具栏那颗没样式） */
.star-btn{font-size:16px;line-height:1;opacity:.5;transition:opacity var(--transition),color var(--transition);flex-shrink:0;cursor:pointer}
.star-btn:hover{opacity:.85}
.star-btn.starred{opacity:1;color:var(--star)}
.song-item .star-btn{opacity:.4}
.song-item .star-btn:hover{opacity:.8}
.song-item .star-btn.starred{opacity:1;color:var(--star)}
.song-item .edit-btn{font-size:14px;opacity:0;transition:opacity var(--transition);flex-shrink:0;padding:2px 4px;border-radius:3px}
.song-item:hover .edit-btn{opacity:.6}
.song-item .edit-btn:hover{opacity:1;background:var(--surface-3)}

/* 多选模式 */
.song-item .song-checkbox{
  width:16px;height:16px;flex-shrink:0;cursor:pointer;
  border:2px solid var(--border);border-radius:3px;
  display:none;align-items:center;justify-content:center;
  transition:all var(--transition);background:var(--surface);
}
.song-item .song-checkbox.checked{
  background:var(--primary);border-color:var(--primary);
}
.song-item .song-checkbox.checked::after{
  content:'✓';color:#fff;font-size:12px;font-weight:bold;
}
/* 多选模式开启时显示复选框 */
#song-list.multi-select .song-item .song-checkbox{display:flex}
#song-list.multi-select .song-item .edit-btn{display:none}
#song-list.multi-select .song-item.selected{background:var(--primary-dim)}

/* 多选操作栏 */
.multi-select-bar{
  display:none;padding:8px 12px;border-bottom:1px solid var(--border);
  background:var(--surface);gap:6px;align-items:center;flex-wrap:wrap;
}
.multi-select-bar.show{display:flex}
.multi-select-bar .ms-info{
  flex:1;font-size:12px;color:var(--text-muted);min-width:80px;
}
.multi-select-bar button{
  padding:4px 10px;font-size:12px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);transition:all var(--transition);
}
.multi-select-bar button:hover{background:var(--surface-3);border-color:var(--primary)}
.multi-select-bar button.danger{color:var(--danger);border-color:var(--danger)}
.multi-select-bar button.danger:hover{background:var(--danger);color:#fff}
.sidebar-footer{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
.sidebar-footer button{
  flex:1;padding:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:12px;transition:all var(--transition);color:var(--text);
}
.sidebar-footer button:hover{background:var(--surface-3);border-color:var(--primary)}
.sidebar-footer button.primary{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}

/* ==================== 工具栏 ==================== */
#toolbar{
  height:var(--toolbar-h);min-height:var(--toolbar-h);background:var(--surface);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 12px;gap:12px;font-size:13px;overflow-x:auto;white-space:nowrap;
}
.toolbar-group{display:flex;align-items:center;gap:6px}
.toolbar-group+.toolbar-group{border-left:1px solid var(--border);padding-left:12px}
#song-title-bar{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
#song-title-bar .title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
#key-capo-info{color:var(--text-muted);font-size:12px;display:flex;gap:8px}
#key-capo-info span{background:var(--surface-2);padding:2px 8px;border-radius:var(--radius-sm)}
.btn-group{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);overflow:hidden}
.btn-group button{padding:4px 10px;font-size:12px;border:1px solid var(--border);margin-left:-1px;transition:all var(--transition);color:var(--text)}
.btn-group button:hover{background:var(--surface-3)}
.btn-group button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 超出当前谱子页数的档位不可点 */
.btn-group button:disabled{opacity:.3;cursor:not-allowed}
.btn-group button:disabled:hover{background:var(--surface-2)}
.tool-btn{padding:4px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;transition:all var(--transition);display:flex;align-items:center;gap:4px;color:var(--text)}
.tool-btn:hover{background:var(--surface-3);border-color:var(--primary)}
.tool-btn.active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
#sidebar-toggle{padding:4px 8px;font-size:16px}

/* ==================== 皮肤选择器 ==================== */
#theme-selector{display:flex;gap:4px;align-items:center}
.theme-btn{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
  cursor:pointer;transition:all var(--transition);padding:0;
}
.theme-btn:hover{transform:scale(1.15)}
.theme-btn.active{border-color:var(--primary);transform:scale(1.15)}
.theme-btn[data-theme="dark"]{background:#0d1117}
.theme-btn[data-theme="green"]{background:#1a2e1a}
.theme-btn[data-theme="parchment"]{background:#f5f0e1}
.theme-btn[data-theme="ocean"]{background:#0a1628}

/* ==================== 显示区 ==================== */
#display-area{
  flex:1;position:relative;overflow:hidden;background:var(--display-bg);
  display:flex;align-items:center;justify-content:center;
}
#pages-container{
  width:100%;height:100%;display:grid;gap:2px;padding:2px;
  overflow:hidden;
  /* 垂直方向交给浏览器原生滚动，水平方向留给 swipe 切屏手势 */
  touch-action:pan-y;
}
/* 适应页模式：每页按自身宽高比缩放后紧挨着居中排列。
   以前用 repeat(cols,1fr) 把每页撑成等宽列，纵向页面横向填不满列宽，
   于是两页之间会空出一大块；改成按实际尺寸排布后页面自然贴在一起。 */
#pages-container.fit-boxes{
  display:grid;
  justify-content:center;
  align-content:center;
  overflow:hidden;
}
#pages-container.fit-boxes .page-slot{
  justify-self:center;
  align-self:center;
}
/* 宽排（4 页横向）放不下时不再缩小页面，改为容器横向滚动 */
#pages-container.fit-boxes.hscroll{
  overflow-x:auto;
  overflow-y:hidden;
  /* 横向交给原生滚动，纵向留给切屏手势 */
  touch-action:pan-x pan-y;
}
.page-slot{
  position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:var(--page-bg);border-radius:2px;min-height:0;min-width:0;
}
.page-slot img,.page-slot canvas{
  max-width:100%;max-height:100%;object-fit:contain;
}
.page-error{
  color:var(--danger);font-size:12px;text-align:center;padding:20px;
}

/* 定时翻页的间隔设定 */
.timer-control{
  display:flex;align-items:center;gap:4px;padding:2px 8px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:11px;color:var(--text-muted);
}
.timer-control input[type="number"]{
  width:52px;padding:2px 4px;text-align:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);font-size:12px;
}
.timer-control input[type="number"]:focus{outline:none;border-color:var(--primary)}

/* ==================== 空状态 ==================== */
#empty-state{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;color:var(--text-muted);
  pointer-events:none;
}
#empty-state .icon{font-size:64px;opacity:.3}
#empty-state h2{font-size:20px;font-weight:400}
#empty-state p{font-size:14px;text-align:center;max-width:400px;line-height:1.8}
#empty-state .drag-hint{
  border:2px dashed var(--border);border-radius:12px;padding:40px 60px;
  text-align:center;transition:border-color var(--transition);pointer-events:auto;
}
#empty-state.drag-over .drag-hint{border-color:var(--primary);background:var(--primary-dim)}
#empty-state .btn-primary{pointer-events:auto;margin-top:8px}

/* ==================== 拖拽高亮 ==================== */
#display-area.drag-over{background:var(--primary-dim)}
#display-area.drag-over::after{
  content:"释放以导入文件";position:absolute;inset:8px;border:3px dashed var(--primary);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--primary);pointer-events:none;
}

/* ==================== 状态栏 ==================== */
#status-bar{
  height:var(--statusbar-h);min-height:var(--statusbar-h);background:var(--surface);
  border-top:1px solid var(--border);display:flex;align-items:center;
  padding:0 16px;gap:16px;font-size:12px;
}
#status-bar .page-info{flex:1;text-align:center;color:var(--text-muted)}
#status-bar .page-info strong{color:var(--text)}
.status-progress{flex:1;height:2px;background:var(--surface-3);border-radius:1px;overflow:hidden;max-width:200px}
.status-progress-fill{height:100%;background:var(--primary);transition:width .3s ease}
.nav-btn{padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);transition:all var(--transition);color:var(--text)}
.nav-btn:hover{background:var(--surface-3);border-color:var(--primary)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}

/* ==================== 倒计时环 ==================== */
#countdown-ring{
  position:absolute;bottom:16px;right:16px;width:56px;height:56px;
  display:none;align-items:center;justify-content:center;z-index:10;
}
#countdown-ring.show{display:flex}
#countdown-ring svg{position:absolute;width:100%;height:100%;transform:rotate(-90deg)}
#countdown-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4}
#countdown-ring .ring-fg{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
#countdown-text{font-size:16px;font-weight:700;z-index:1}

/* ==================== Toast ==================== */
#toast-container{
  position:fixed;top:16px;right:16px;z-index:9999;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toastIn .3s ease;
  max-width:360px;pointer-events:auto;
}
.toast.info{border-left:3px solid var(--primary)}
.toast.success{border-left:3px solid var(--success)}
.toast.warning{border-left:3px solid var(--warning)}
.toast.error{border-left:3px solid var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* ==================== 模态框 ==================== */
#modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px;
}
#modal-overlay.show{display:flex}
#modal{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;
}
#modal h2{font-size:18px;margin-bottom:8px}
.modal-subtitle{color:var(--text-muted);font-size:13px;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:8px 10px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--primary);
}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn-primary,.btn-secondary,.btn-danger{
  padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;
  border:1px solid var(--border);transition:all var(--transition);
}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface-2);color:var(--text)}
.btn-secondary:hover{background:var(--surface-3)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{opacity:.85}

/* ==================== 导入确认列表 ==================== */
.import-list{max-height:50vh;overflow-y:auto;margin-bottom:16px}
.import-item{
  padding:12px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:8px;
}
.import-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.import-item-header .page-count{font-size:12px;color:var(--text-muted)}
.dup-warning{color:var(--warning);font-size:11px}

/* ==================== 进度条 ==================== */
#progress-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;
  display:none;align-items:center;justify-content:center;
}
#progress-overlay.show{display:flex}
#progress-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 32px;min-width:300px;text-align:center;
}
#progress-title{font-size:14px;margin-bottom:12px}
.progress-bar{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress-bar-fill{height:100%;background:var(--primary);transition:width .3s ease;width:0}
.progress-text{font-size:12px;color:var(--text-muted)}

/* ==================== 全屏：只留谱面 ==================== */
/* 进入全屏后把上下两条工具条收起来，把可用高度全让给曲谱 */
body.fullscreen #toolbar,
body.fullscreen #status-bar{display:none}

/* ==================== 响应式 ==================== */
@media(max-width:768px){
  :root{--sidebar-w:260px}
  #toolbar{font-size:12px;gap:8px;padding:0 8px}
  .toolbar-group+.toolbar-group{padding-left:8px}
  #song-title-bar .title-text{max-width:100px}
  /* 侧栏改为浮层抽屉：收起时完全不占版面，展开时盖在内容上 */
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:200;width:var(--sidebar-w);
    box-shadow:2px 0 12px rgba(0,0,0,.35);
    transition:transform var(--transition);
  }
  #sidebar.collapsed{width:var(--sidebar-w);min-width:var(--sidebar-w);transform:translateX(-100%)}
  /* 小屏省掉次要控件，避免工具栏被挤爆 */
  #key-capo-info{display:none}
  .timer-control span{display:none}
  #status-bar{padding:0 8px;gap:8px}
  .nav-btn{padding:6px 8px}
}

</style>
</head>
<body>
<div id="app">
  <!-- ==================== 侧栏 ==================== -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>🎸 吉他谱阅读器</h1>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索歌名/歌手/标签..." />
      </div>
    </div>
    <div class="sidebar-controls">
      <select id="sort-select">
        <option value="createdAt">按添加时间</option>
        <option value="title">按歌名</option>
        <option value="artist">按歌手</option>
        <option value="lastOpenedAt">按最近打开</option>
      </select>
      <div class="tag-bar" id="tag-bar"></div>
    </div>
    
    <!-- 多选操作栏 -->
    <div class="multi-select-bar" id="multi-select-bar">
