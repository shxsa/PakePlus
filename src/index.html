<!-- ==================== CDN 依赖（SRI 校验 + 多镜像回退） ==================== -->
<script>
/* 三个镜像分发的是同一份文件，实测 sha384 完全一致，因此共用一份摘要。
   某个镜像不可用（被拦截、超时、内容被篡改）时自动尝试下一个。 */
window.__depsReady = (async function(){
  // 允许外部注入依赖地址：离线使用、或自动化测试时指向本地副本，让加载结果可复现。
  // 例：window.__DEPS_OVERRIDE__ = { pdf:'file:///.../pdf.min.js', pdfWorker:'file:///.../pdf.worker.min.js', jszip:'file:///.../jszip.min.js' }
  const OVERRIDE = (typeof window !== 'undefined' && window.__DEPS_OVERRIDE__) || {};

  const LIBS = [
    {
      key: 'pdf',
      name: 'pdfjsLib',
      ready: () => typeof pdfjsLib !== 'undefined',
      integrity: 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e',
      urls: [
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
        'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
        'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js'
      ],
      bases: [
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/',
        'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/',
        'https://unpkg.com/pdfjs-dist@3.11.174/build/'
      ]
    },
    {
      key: 'jszip',
      name: 'JSZip',
      ready: () => typeof JSZip !== 'undefined',
      integrity: 'sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG',
      urls: [
        'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
        'https://fastly.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
        'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'
      ],
      bases: ['', '', '']
    }
  ];

  // 单次尝试的超时上限。CDN 被黑洞时请求会一直挂着不返回，
  // 没有超时的话 __depsReady 永远不 resolve。
  // 由于依赖加载已经不阻塞启动，这里可以给得宽松一些（慢网络也能等到）。
  const MIRROR_TIMEOUT_MS = 12000;

  function loadOne(url, integrity, timeoutMs){
    return new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      let done = false;
      const finish = (fn, arg)=>{
        if(done) return;
        done = true;
        clearTimeout(timer);
        fn(arg);
      };
      const timer = setTimeout(()=>{
        // 超时后摘掉标签并解绑回调，尽量让它之后不再执行，然后换下一个镜像
        s.onload = null;
        s.onerror = null;
        s.remove();
        finish(reject, new Error('加载超时(' + timeoutMs + 'ms)'));
      }, timeoutMs);
      s.src = url;
      s.async = false;
      // 注入本地 file:// 副本时不带 SRI：本地文件不需要完整性校验，带上反而会因协议差异失败
      if(integrity && !/^file:/i.test(url)){ s.integrity = integrity; s.crossOrigin = 'anonymous'; }
      s.onload = ()=>finish(resolve);
      s.onerror = ()=>finish(reject, new Error('加载失败: ' + url));
      document.head.appendChild(s);
    });
  }

  async function load(lib){
    if(lib.ready()) return { ok:true, base: lib.bases[0] };

    // 优先使用外部注入的地址
    const forced = OVERRIDE[lib.key];
    if(forced){
      try{
        await loadOne(forced, null, MIRROR_TIMEOUT_MS);
      }catch(e){
        console.warn('[依赖加载] 注入地址不可用：', forced, e.message);
      }
      return { ok: lib.ready(), base: '' };
    }
    for(let i=0; i<lib.urls.length; i++){
      try{
        await loadOne(lib.urls[i], lib.integrity, MIRROR_TIMEOUT_MS);
        if(lib.ready()) return { ok:true, base: lib.bases[i] };
      }catch(e){
        console.warn('[依赖加载] 镜像不可用，尝试下一个：', lib.urls[i], e.message);
      }
    }
    return { ok:false, base:'' };
  }

  const results = await Promise.all(LIBS.map(load));
  const resolved = {
    pdf: results[0].ok,
    jszip: results[1].ok,
    base: results[0].base || '',
    worker: OVERRIDE.pdfWorker || ''      // 显式指定的 worker 地址优先
  };
  window.__depsResolved = resolved;       // 供运行期按需读取（不阻塞应用启动）
  return resolved;
})();
</script>

<script>
"use strict";
/* ============================================================
 * 吉他谱弹唱阅读器 - 单文件应用
 * 模块组织：Utils → DB → Import → Render → Paging → Library → Backup → UI → Shortcuts → Init
 * ============================================================ */
(function(){

/* ==================== 全局状态 ==================== */
const State = {
  songs: [],
  currentSong: null,
  currentScreen: 0,
  pagesPerScreen: 2,
  sortBy: 'createdAt',
  searchQuery: '',
  activeTag: null,
  sidebarCollapsed: false,
  _sidebarWasOpen: false,      // 进全屏前侧栏是否展开，用于退出时还原
  theme: 'dark',
  multiSelectMode: false,      // 多选模式开关
  selectedSongs: new Set(),    // 选中的歌曲ID集合
  timedPaging: { active:false, paused:false, interval:15, remaining:15, rafId:null, lastTime:0 },
  renderedSlots: [],
  pdfDocCache: new Map(),
  objectURLs: new Map(),
  pageAspect: new Map(),   // type:fileId:pageIndex -> 宽高比，用于按页面比例排布
  resizeTimer: null,
  renderToken: 0,        // 每次重渲染自增，用于作废仍在飞行中的旧渲染任务
  screenReady: true,     // 当前屏所有页面是否渲染完毕
  hScrollable: false,    // 当前屏是否为"宽排 + 横向滚动"（此时横向滑动用来滚谱面而不是切屏）
};

/* ==================== 工具函数模块 ==================== */
const Utils = {
  toast(msg, type='info', duration=3000){
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(()=>{
      el.style.animation = 'toastOut .3s ease forwards';
      setTimeout(()=>el.remove(), 300);
    }, duration);
  },

  debounce(fn, delay){
    let t;
    return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), delay); };
  },

  uuid(){
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
      const r = Math.random()*16|0;
      const v = c==='x' ? r : (r&0x3|0x8);
      return v.toString(16);
    });
  },

  // 自然排序比较（page2 排在 page10 之前）
  naturalCompare(a, b){
    const ax = [], bx = [];
    a.replace(/(\d+)|(\D+)/g, (_, $1, $2) => { ax.push([$1||Infinity, $2||""]); });
    b.replace(/(\d+)|(\D+)/g, (_, $1, $2) => { bx.push([$1||Infinity, $2||""]); });
    while(ax.length && bx.length){
      const an = ax.shift(), bn = bx.shift();
      const nn = (an[0] - bn[0]) || an[1].localeCompare(bn[1]);
      if(nn) return nn;
    }
    return ax.length - bx.length;
  },

  // 计算文件哈希（用于去重）
  async computeHash(file){
    try{
      const buf = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest('SHA-256', buf);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){
      // 降级：用大小+修改时间作为简易哈希
      return 'size_' + file.size + '_time_' + file.lastModified;
    }
  },

  formatTime(ts){
    if(!ts) return '从未';
    const d = new Date(ts);
    const now = Date.now();
    const diff = now - ts;
    if(diff < 60000) return '刚刚';
    if(diff < 3600000) return Math.floor(diff/60000) + '分钟前';
    if(diff < 86400000) return Math.floor(diff/3600000) + '小时前';
    if(diff < 604800000) return Math.floor(diff/86400000) + '天前';
    return d.toLocaleDateString('zh-CN');
  },

  isImage(file){
    // 优先用 MIME 类型判断，兜底用扩展名判断（webkitdirectory 选择的文件 type 可能为空）
    if(file.type && file.type.startsWith('image/')) return true;
    return /\.(jpe?g|png|webp|gif|bmp|svg|tiff?|avif)$/i.test(file.name);
  },
  isPDF(file){
    return file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  },

  // 统一转义（原先在 Import/Render/Library 三个模块里各抄了一份）
  // 属性值场景一律用它；注意它不能用于拼接内联 onclick 里的 JS 字符串
  escapeHtml(s){
    if(s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  },

  // 数值夹取（速度等参数统一走这里，避免各处边界不一致）
  clamp(value, min, max){
    const n = Number(value);
    if(!isFinite(n)) return min;
    return Math.min(max, Math.max(min, n));
  },

  // 用于拼接进内联 onclick 的 JS 字符串字面量。
  // HTML 实体转义在这里没用（属性值会先被解码再交给 JS 解析），所以直接把非 id 字符剔掉。
  // 正常 id 是 UUID，不受影响；即使 id 来自被篡改的备份文件也无法逃逸出字符串。
  jsId(id){
    return String(id == null ? '' : id).replace(/[^A-Za-z0-9_-]/g, '');
  },
};

/* ==================== PDF 依赖的按需获取 ==================== */
/* 【重要】绝不能在 App.init 里 await 依赖加载。
   CDN 被黑洞时请求会长时间挂起，一旦把等待放在启动路径上，整个应用就再也初始化不了
   —— 数据库没开、事件没绑、曲库为空，表现就是"网页卡死、点导入没任何反应"。
   所以依赖改成按需获取：启动照常走完，真正要用到 PDF 能力时再等，而且自带超时上限。 */
const PdfLib = {
  DEFAULT_BASE: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/',
  _configured: false,
  _failedOnce: false,

  /* 返回可用的 pdfjsLib；超时或最终失败返回 null（调用方需自行降级）。
     这里采用"轮询等库出现"而不是"等 __depsReady 结算"：
     镜像超时后迟到的脚本仍可能执行成功，轮询能第一时间抓住它，
     不会出现"库其实已经到了、却因为我们提前放弃而误判不可用"。
     一旦确认失败过，后续调用立即返回，避免每次导入都白等一遍。 */
  async get(limitMs = 20000){
    if(typeof pdfjsLib !== 'undefined'){
      PdfLib._configure();
      return pdfjsLib;
    }
    if(PdfLib._failedOnce) return null;

    const deadline = Date.now() + limitMs;
    while(typeof pdfjsLib === 'undefined'){
      if(Date.now() >= deadline){
        PdfLib._failedOnce = true;
        return null;
      }
      await new Promise(r=>setTimeout(r, 120));
    }
    PdfLib._configure();
    return pdfjsLib;
  },

  _configure(){
    if(PdfLib._configured || typeof pdfjsLib === 'undefined') return;
    const deps = window.__depsResolved || {};
    const base = deps.base || PdfLib.DEFAULT_BASE;
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc = deps.worker || (base + 'pdf.worker.min.js');
      PdfLib._configured = true;
    }catch(e){ /* 配置失败不致命，pdf.js 会自行兜底 */ }
  },
};

/* ==================== 数据库模块 (IndexedDB) ==================== */
const DB = {
  db: null,

  async init(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open('GuitarSheetReader', 1);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('songs')){
          const store = db.createObjectStore('songs', { keyPath:'id' });
          store.createIndex('title', 'title', { unique:false });
          store.createIndex('createdAt', 'createdAt', { unique:false });
          store.createIndex('lastOpenedAt', 'lastOpenedAt', { unique:false });
        }
        if(!db.objectStoreNames.contains('files')){
          const store = db.createObjectStore('files', { keyPath:'fileId' });
          store.createIndex('hash', 'hash', { unique:false });
          store.createIndex('songId', 'songId', { unique:false });
        }
      };
      req.onsuccess = (e)=>{
        DB.db = e.target.result;
        // 其他标签页请求升级数据库版本时主动让出连接，避免互相卡死
        DB.db.onversionchange = ()=>{
          try{ DB.db.close(); }catch(err){}
          DB.db = null;
          Utils.toast('数据库已在其他标签页被升级，请刷新本页','warning',6000);
        };
        resolve();
      };
      req.onerror = (e)=>{ reject(e.target.error); };
      // 本页占用旧版本连接导致其他标签页升级不了时触发
      req.onblocked = ()=>{
        reject(new Error('数据库被其他标签页占用，请关闭其他标签页后重试'));
      };
    });
  },

  _tx(store, mode='readonly'){
    return DB.db.transaction(store, mode).objectStore(store);
  },

  async getAllSongs(){
    return new Promise((resolve, reject)=>{
      const req = DB._tx('songs').getAll();
      req.onsuccess = ()=>resolve(req.result || []);
      req.onerror = ()=>reject(req.error);
    });
  },

  async getSong(id){
    return new Promise((resolve, reject)=>{
      const req = DB._tx('songs').get(id);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  },

  async saveSong(song){
    return new Promise((resolve, reject)=>{
      const req = DB._tx('songs','readwrite').put(song);
      req.onsuccess = ()=>resolve();
      req.onerror = ()=>reject(req.error);
    });
  },

  async deleteSong(id){
    return new Promise((resolve, reject)=>{
      const req = DB._tx('songs','readwrite').delete(id);
      req.onsuccess = ()=>resolve();
      req.onerror = ()=>reject(req.error);
    });
  },

  async saveFile(fileRecord){
    return new Promise((resolve, reject)=>{
      const req = DB._tx('files','readwrite').put(fileRecord);
      req.onsuccess = ()=>resolve();
      req.onerror = ()=>reject(req.error);
    });
  },

  async getFile(fileId){
    return new Promise((resolve, reject)=>{
      const req = DB._tx('files').get(fileId);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  },

  async getFileByHash(hash){
    return new Promise((resolve, reject)=>{
      const idx = DB._tx('files').index('hash');
      const req = idx.get(hash);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  },

  async getAllFiles(){
    return new Promise((resolve, reject)=>{
      const req = DB._tx('files').getAll();
      req.onsuccess = ()=>resolve(req.result || []);
      req.onerror = ()=>reject(req.error);
    });
  },

  async deleteFile(fileId){
    return new Promise((resolve, reject)=>{
      const req = DB._tx('files','readwrite').delete(fileId);
      req.onsuccess = ()=>resolve();
      req.onerror = ()=>reject(req.error);
    });
  },

  // 按 songId 索引取文件记录（仅用于兜住旧数据残留，判断真实归属请用 refsOf）
  async getFilesBySongId(songId){
    return new Promise((resolve, reject)=>{
      const idx = DB._tx('files').index('songId');
      const req = idx.getAll(IDBKeyRange.only(songId));
      req.onsuccess = ()=>resolve(req.result || []);
      req.onerror = ()=>reject(req.error);
    });
  },

  // 读取文件记录的真实引用者列表，兼容只有 songId 的旧记录
  refsOf(record){
    if(!record) return [];
    if(Array.isArray(record.refSongIds) && record.refSongIds.length > 0) return record.refSongIds.slice();
    return record.songId ? [record.songId] : [];
  },

  /** 引用计数式删除歌曲文件。
   *  【历史 bug】导入时按 hash 去重会复用其他歌曲的 fileId，旧实现却直接按 songId 删文件，
   *  于是删掉 A 歌会把 B 歌仍在复用的文件一起删掉，B 歌页面变成"文件不存在"。
   *  这里以"全库歌曲的 pages"为唯一事实来源统计真实引用关系：即使记录里没有 refSongIds
   *  （旧数据），也不会误删其他歌曲仍在使用的文件。 */
  async deleteFilesBySongId(songId){
    // 不在这里因 song 不存在而提前返回：万一调用方先删了歌曲记录，
    // 仍然要靠 songId 索引把文件清理掉，否则 blob 会永久泄漏。
    const song = await DB.getSong(songId);

    // 统计 fileId -> 引用它的歌曲集合
    const allSongs = await DB.getAllSongs();
    const refMap = new Map();
    for(const s of allSongs){
      for(const p of (s.pages || [])){
        if(!refMap.has(p.fileId)) refMap.set(p.fileId, new Set());
        refMap.get(p.fileId).add(s.id);
      }
    }

    // 候选 = 本歌页面引用到的文件 + 索引里记在本歌名下的文件（后者用于顺带清理孤儿 blob）
    const candidates = new Set(song ? (song.pages || []).map(p => p.fileId) : []);
    const owned = await DB.getFilesBySongId(songId);
    for(const f of owned) candidates.add(f.fileId);

    for(const fileId of candidates){
      const record = await DB.getFile(fileId);
      if(!record) continue;

      // 去掉本歌之后还有谁在用（正常调用顺序下 song 尚未从 songs 表删除，会包含它自己）
      const refs = Array.from(refMap.get(fileId) || []).filter(id => id !== songId);

      if(refs.length === 0){
        // 已无任何歌曲引用，真正删除 blob
        await DB.deleteFile(fileId);
      } else {
        // 仍被其他歌曲引用：只摘引用，并把 songId 索引改指向一个仍然存在的歌曲，顺带自愈旧数据
        record.refSongIds = refs;
        record.songId = refs[0];
        await DB.saveFile(record);
      }
    }
  },

  async clearAll(){
    return new Promise((resolve, reject)=>{
      const tx = DB.db.transaction(['songs','files'],'readwrite');
      tx.objectStore('songs').clear();
      tx.objectStore('files').clear();
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  },
};

/* ==================== 导入模块 ==================== */
const ImportModule = {
  pendingGroups: [],
  lastGroupedByFolder: false,   // 上一次分组是否基于文件夹（决定确认弹窗的文案）

  openFilePicker(){
    document.getElementById('file-input').value = '';
    document.getElementById('file-input').click();
  },

  openFolderPicker(){
    document.getElementById('folder-input').value = '';
    document.getElementById('folder-input').click();
  },

  appendToCurrent(){
    if(!State.currentSong){ Utils.toast('请先选择一首歌曲','warning'); return; }
    document.getElementById('append-input').value = '';
    document.getElementById('append-input').click();
  },

  // 【修复3】文件选择：使用 webkitRelativePath 保留文件夹结构
  async handleFileInput(event){
    const files = Array.from(event.target.files);
    if(files.length === 0) return;
    // 优先使用 webkitRelativePath（文件夹选择时包含路径），否则用文件名
    const fileList = files.map(f=>({
      file: f,
      relativePath: f.webkitRelativePath || f.name
    }));
    await ImportModule.processFiles(fileList);
  },

  async handleDrop(event){
    event.preventDefault();
    document.getElementById('display-area').classList.remove('drag-over');
    const emptyState = document.getElementById('empty-state');
    if(emptyState) emptyState.classList.remove('drag-over');
    const items = event.dataTransfer.items;
    const fileList = [];

    if(items && items.length > 0 && items[0].webkitGetAsEntry){
      const entries = [];
      for(let i=0; i<items.length; i++){
        const entry = items[i].webkitGetAsEntry();
        if(entry) entries.push(entry);
      }
      for(const entry of entries){
        await ImportModule.traverseEntry(entry, '', fileList);
      }
    } else {
      for(let i=0; i<event.dataTransfer.files.length; i++){
        const f = event.dataTransfer.files[i];
        fileList.push({file:f, relativePath:f.name});
      }
    }

    if(fileList.length === 0) return;
    await ImportModule.processFiles(fileList);
  },

  // 递归遍历 FileSystemEntry（拖拽文件夹时使用）
  async traverseEntry(entry, path, fileList){
    if(entry.isFile){
      const file = await new Promise((resolve,reject)=>entry.file(resolve,reject));
      fileList.push({file, relativePath: path + entry.name});
    } else if(entry.isDirectory){
      const reader = entry.createReader();
      const allEntries = [];
      const readBatch = ()=>{
        return new Promise((resolve,reject)=>{
          reader.readEntries((results)=>{
            if(results.length === 0) resolve();
            else { allEntries.push(...results); readBatch(); }
          }, reject);
        });
      };
      await readBatch();
      for(const child of allEntries){
        await ImportModule.traverseEntry(child, path + entry.name + '/', fileList);
      }
    }
  },

  async processFiles(fileList){
    const supported = fileList.filter(({file})=>Utils.isImage(file) || Utils.isPDF(file));
    if(supported.length === 0){
      Utils.toast('未检测到支持的文件（图片或PDF）','warning');
      return;
    }

    const groups = ImportModule.groupFiles(supported);
    if(groups.length === 0){
      Utils.toast('未能从文件中识别出歌曲','warning');
      return;
    }

    ImportModule.pendingGroups = groups;
    ImportModule.showImportConfirm(groups);
  },

  // 【修复1】智能分组：直接按子文件夹分组
  // 简单逻辑：找到公共父目录，其下的每个直接子文件夹 = 一首歌
  // 空文件夹也会被统计（只要文件夹存在就创建一首歌）
  groupFiles(fileList){
    // 第一步：解析所有路径
    const parsed = fileList.map(({file, relativePath}) => {
      const parts = relativePath.split(/[\/\\]/).filter(p => p.length > 0);
      return {file, relativePath, parts};
    });
    
    const withDirs = parsed.filter(p => p.parts.length > 1);
    // 记录分组依据：散图导入时说"共识别到 N 个文件夹"是错的
    ImportModule.lastGroupedByFolder = withDirs.length > 0;
    if(withDirs.length === 0){
      // 全是散图，合并为一首新歌
      return ImportModule.createGroupsFromFiles('新歌', parsed);
    }
    
    // 第二步：计算公共前缀深度（所有路径共享的目录层级）
    let prefixDepth = 0;
    const minLen = Math.min(...withDirs.map(p => p.parts.length));
    for(let level = 0; level < minLen - 1; level++){
      const firstDir = withDirs[0].parts[level];
      const allSame = withDirs.every(p => p.parts[level] === firstDir);
      if(allSame) prefixDepth = level + 1;
      else break;
    }
    
    // 第三步：按公共前缀的下一级目录分组
    // 每个不同的子文件夹 = 一首歌
    const dirMap = new Map();
    for(const {file, relativePath, parts} of parsed){
      if(parts.length > prefixDepth + 1){
        // 有子目录：取 prefixDepth 层级的目录名作为分组 key
        const dir = parts[prefixDepth];
        if(!dirMap.has(dir)) dirMap.set(dir, []);
        dirMap.get(dir).push({file, relativePath});
      } else {
        // 散图（在公共前缀目录下但没有子文件夹）
        if(!dirMap.has('')) dirMap.set('', []);
        dirMap.get('').push({file, relativePath});
      }
    }

    const allGroups = [];
    const subDirs = Array.from(dirMap.keys()).filter(d => d !== '');
    
    // 每个子文件夹 = 一首歌
    for(const dir of subDirs){
      allGroups.push(...ImportModule.createGroupsFromFiles(dir, dirMap.get(dir)));
    }
    // 根目录散图（如果有）
    if(dirMap.has('')){
      allGroups.push(...ImportModule.createGroupsFromFiles('未分组图片', dirMap.get('')));
    }
    // 如果没有任何分组（全是散图），合并为一首新歌
    if(allGroups.length === 0){
      allGroups.push(...ImportModule.createGroupsFromFiles('新歌', parsed));
    }

    return allGroups;
  },

  // 从文件列表创建歌曲分组
  // 策略：每个文件夹 = 一首歌（即使文件夹为空也创建，保证数量与文件夹数一致）
  // 文件夹内的图片和 PDF 合并为同一首歌的页面
  createGroupsFromFiles(defaultName, files){
    const pdfs = files.filter(f=>Utils.isPDF(f.file));
    const images = files.filter(f=>Utils.isImage(f.file));
    
    // 图片按文件名自然排序
    images.sort((a,b)=>Utils.naturalCompare(a.file.name, b.file.name));
    
    // 合并图片和 PDF 作为同一首歌的页面
    const allFiles = [];
    for(const img of images){
      allFiles.push({file:img.file, type:'image'});
    }
    for(const pdf of pdfs){
      allFiles.push({file:pdf.file, type:'pdf'});
    }
    
    // 即使文件夹为空（没有图片或PDF），也创建一个分组
    // 这样空文件夹也会被统计，数量与文件夹数一致
    const groups = [{
      title: defaultName,
      artist: '',
      tags: [],
      files: allFiles,
      pageCount: allFiles.length,
    }];

    return groups;
  },

  showImportConfirm(groups){
    // 统计有效歌曲数（有文件的分组）和空文件夹数
    const validCount = groups.filter(g => g.pageCount > 0).length;
    const emptyCount = groups.length - validCount;
    const unit = ImportModule.lastGroupedByFolder ? '个文件夹' : '首歌曲';
    let subtitle = `共识别到 ${groups.length} ${unit}`;
    if(emptyCount > 0){
      subtitle += `（其中 ${validCount} 首有内容，${emptyCount} 个空文件夹将被跳过）`;
    } else {
      subtitle += `，均可编辑歌名/歌手/标签后确认导入`;
    }
    
    const html = `
      <h2>确认导入</h2>
      <p class="modal-subtitle">${subtitle}</p>
      <div class="import-list">
        ${groups.map((g, i)=>`
          <div class="import-item">
            <div class="import-item-header">
              <strong>第 ${i+1} 首${g.pageCount === 0 ? '（空文件夹）' : ''}</strong>
              <span class="page-count">${g.pageCount} 页</span>
              <span class="dup-warning" style="display:none">⚠ 疑似重复</span>
            </div>
            <div class="form-row">
              <div class="form-group" style="flex:2">
                <input type="text" class="imp-title" placeholder="歌名" value="${Utils.escapeHtml(g.title)}">
              </div>
              <div class="form-group" style="flex:1">
                <input type="text" class="imp-artist" placeholder="歌手" value="${Utils.escapeHtml(g.artist)}">
              </div>
            </div>
            <div class="form-group">
              <input type="text" class="imp-tags" placeholder="标签（逗号分隔）" value="${Utils.escapeHtml((g.tags || []).join(', '))}">
            </div>
          </div>
        `).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="UIModule.closeModal()">取消</button>
        <button class="btn-primary" onclick="ImportModule.confirmImport()">确认导入</button>
      </div>
    `;
    UIModule.showModal(html);
  },

  // 确认导入：保存文件和歌曲到 IndexedDB
  async confirmImport(){
    const items = document.querySelectorAll('.import-item');
    let groups = ImportModule.pendingGroups;
    UIModule.closeModal();
    UIModule.showProgress('正在导入...');

    // PDF 能力预检：拿不到 pdf.js 时不要把 PDF 当成"1 页"塞进曲库，
    // 那会写入错误的页数（等于坏数据）。宁可明确跳过并告知用户。
    if(groups.some(g => (g.files||[]).some(f => f.type === 'pdf'))){
      UIModule.updateProgressTitle('正在准备 PDF 组件...');
      const lib = await PdfLib.get(15000);
      if(!lib){
        const before = groups.reduce((s,g)=>s+(g.files||[]).length, 0);
        groups = groups.map(g => ({ ...g, files: (g.files||[]).filter(f => f.type !== 'pdf') }));
        const after = groups.reduce((s,g)=>s+(g.files||[]).length, 0);
        Utils.toast(`PDF 组件不可用，已跳过 ${before - after} 个 PDF 文件；网络恢复后重新导入即可`,'warning',7000);
      }
      UIModule.updateProgressTitle('正在导入...');
    }

    let totalFiles = groups.reduce((s,g)=>s+g.files.length, 0);
    let processed = 0;
    let importedSongs = 0;
    let skippedDup = 0;
    let failedGroups = 0;

    try{
      for(let gi=0; gi<groups.length; gi++){
        const group = groups[gi];
        // 从模态框获取用户编辑的标题/歌手/标签，如果获取失败则用默认值
        let title = group.title || '未命名';
        let artist = group.artist || '';
        let tags = group.tags || [];
        try{
          const item = items[gi];
          if(item){
            title = item.querySelector('.imp-title')?.value.trim() || title;
            artist = item.querySelector('.imp-artist')?.value.trim() || '';
            const tagsStr = item.querySelector('.imp-tags')?.value.trim() || '';
            tags = tagsStr ? tagsStr.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [];
          }
        }catch(e){
          console.warn('读取导入项UI失败，使用默认值:', e);
        }

        const songId = Utils.uuid();
        const pages = [];
        const batchSize = 5;

        try{
          for(let fi=0; fi<group.files.length; fi++){
            const {file, type} = group.files[fi];
            const hash = await Utils.computeHash(file);

            // 检查重复：如果文件已存在，复用其 fileId（而非跳过）
            const existing = await DB.getFileByHash(hash);
            if(existing){
              skippedDup++;
              // 关键：把当前歌曲登记为共同引用者。
              // 共享文件的记录只记了最早导入那首歌的 songId，不补引用的话，
              // 删除任一引用歌曲时会把其他歌仍在用的文件一起删掉。
              const refs = DB.refsOf(existing);
              if(!refs.includes(songId)){
                refs.push(songId);
                existing.refSongIds = refs;
                await DB.saveFile(existing);
              }
              // 复用已有文件的 fileId，仍然添加为页面
              if(type === 'image'){
                pages.push({type:'image', fileId:existing.fileId});
              } else if(type === 'pdf'){
                const pageCount = await ImportModule.getPdfPageCount(file);
                for(let p=0; p<pageCount; p++){
                  pages.push({type:'pdf', fileId:existing.fileId, pageIndex:p});
                }
              }
              processed++;
              UIModule.updateProgress(processed, totalFiles);
              continue;
            }

            const fileId = Utils.uuid();
            if(type === 'image'){
              await DB.saveFile({fileId, songId, refSongIds:[songId], name:file.name, mimeType:file.type, blob:file, size:file.size, hash});
              pages.push({type:'image', fileId});
            } else if(type === 'pdf'){
              await DB.saveFile({fileId, songId, refSongIds:[songId], name:file.name, mimeType:'application/pdf', blob:file, size:file.size, hash});
              const pageCount = await ImportModule.getPdfPageCount(file);
              for(let p=0; p<pageCount; p++){
                pages.push({type:'pdf', fileId, pageIndex:p});
              }
            }

            processed++;
            UIModule.updateProgress(processed, totalFiles);
            if(fi % batchSize === 0) await new Promise(r=>setTimeout(r, 0));
          }

          // 只要分组有文件就创建歌曲（即使全部是重复文件，也复用已有文件创建歌曲）
          if(pages.length > 0){
            const song = {
              id: songId, title, artist, tags,
              key:'', capo:0, note:'',
              favorite:false,
              createdAt:Date.now(), lastOpenedAt:0,
              pages,
            };
            await DB.saveSong(song);
            importedSongs++;
          } else {
            // 空文件夹：不计入实际导入数，但也不算失败
            console.warn('跳过空文件夹:', title);
          }
        }catch(groupErr){
          console.error('分组导入失败:', group.title, groupErr);
          failedGroups++;
          // 继续处理下一个分组，不中断整体导入
        }
      }

      UIModule.hideProgress();
      let msg;
      if(importedSongs > 0){
        msg = `成功导入 ${importedSongs} 首歌曲`;
      } else {
        msg = '没有导入任何内容';
      }
      if(skippedDup > 0) msg += `（其中 ${skippedDup} 个文件复用了已有数据）`;
      if(failedGroups > 0) msg += `（${failedGroups} 首导入失败）`;
      // 一首都没导入时不该用"成功"的语气
      Utils.toast(msg, importedSongs > 0 ? 'success' : 'warning', importedSongs > 0 ? 3000 : 6000);

      ImportModule.pendingGroups = [];
      await LibraryModule.refresh();
    }catch(err){
      UIModule.hideProgress();
      if(err && err.name === 'QuotaExceededError'){
        Utils.toast('存储空间不足，请清理或导出备份后重试','error',5000);
      } else {
        Utils.toast('导入失败：' + (err.message||err),'error',5000);
      }
      console.error(err);
    }
  },

  // 只为读取页数，用完必须 destroy，否则每导入一个 PDF 就泄漏一个 pdf.js 文档与 worker
  async getPdfPageCount(file){
    const lib = await PdfLib.get();          // 按需等待依赖，自带超时
    if(!lib) return 1;
    let pdf = null;
    try{
      const buf = await file.arrayBuffer();
      pdf = await lib.getDocument({data: buf}).promise;
      return pdf.numPages;
    }catch(e){
      console.error('PDF页数获取失败:', e);
      return 1;
    }finally{
      if(pdf){ try{ await pdf.destroy(); }catch(e){} }
    }
  },

  // 追加页面到当前歌曲
  async handleAppend(event){
    const files = Array.from(event.target.files);
    if(files.length === 0) return;
    if(!State.currentSong) return;

    // PDF 能力预检：组件不可用时不要把 PDF 当成"1 页"追加进去
    let usableFiles = files;
    if(files.some(f => Utils.isPDF(f))){
      const lib = await PdfLib.get(15000);
      if(!lib){
        usableFiles = files.filter(f => !Utils.isPDF(f));
        const skipped = files.length - usableFiles.length;
        if(usableFiles.length === 0){
          Utils.toast('PDF 组件不可用，无法追加 PDF（网络恢复后重试）','warning',7000);
          return;
        }
        Utils.toast(`PDF 组件不可用，已跳过 ${skipped} 个 PDF 文件`,'warning',7000);
      }
    }

    UIModule.showProgress('正在追加...');
    const song = State.currentSong;
    let processed = 0;
    const total = usableFiles.length;

    try{
      for(const file of usableFiles){
        if(!Utils.isImage(file) && !Utils.isPDF(file)){
          processed++;
          continue;
        }

        const hash = await Utils.computeHash(file);
        const existing = await DB.getFileByHash(hash);
        const fileId = existing ? existing.fileId : Utils.uuid();

        if(existing){
          // 复用别人的文件时同样要登记引用，否则删除时会把共享文件误删
          const refs = DB.refsOf(existing);
          if(!refs.includes(song.id)){
            refs.push(song.id);
            existing.refSongIds = refs;
            await DB.saveFile(existing);
          }
        }

        if(Utils.isImage(file)){
          if(!existing){
            await DB.saveFile({fileId, songId:song.id, refSongIds:[song.id], name:file.name, mimeType:file.type, blob:file, size:file.size, hash});
          }
          song.pages.push({type:'image', fileId});
        } else if(Utils.isPDF(file)){
          if(!existing){
            await DB.saveFile({fileId, songId:song.id, refSongIds:[song.id], name:file.name, mimeType:'application/pdf', blob:file, size:file.size, hash});
          }
          const pageCount = await ImportModule.getPdfPageCount(file);
          for(let p=0; p<pageCount; p++){
            song.pages.push({type:'pdf', fileId, pageIndex:p});
          }
        }

        processed++;
        UIModule.updateProgress(processed, total);
        if(processed % 5 === 0) await new Promise(r=>setTimeout(r,0));
      }

      await DB.saveSong(song);
      UIModule.hideProgress();
      await LibraryModule.refresh();
      // refresh 把 State.songs 换成了新对象，这里同步一次当前歌曲，避免两份数据不一致
      const fresh = await DB.getSong(song.id);
      if(fresh) State.currentSong = fresh;
      State.currentScreen = Math.max(0, Math.floor((song.pages.length - 1) / State.pagesPerScreen));
      await RenderModule.renderScreen();
      Utils.toast(`已追加 ${usableFiles.length} 个文件到「${song.title}」`,'success');
    }catch(err){
      UIModule.hideProgress();
      Utils.toast('追加失败：'+(err.message||err),'error');
    }
  },
};

/* ==================== 渲染模块 (显示引擎) ==================== */
const RenderModule = {

  calculateLayout(pageCount, vw, vh){
    const ratio = vw / vh;
    let rows, cols;
    switch(pageCount){
      case 1: rows=1; cols=1; break;
      case 2:
        if(ratio > 1.2){ rows=1; cols=2; } else { rows=2; cols=1; }
        break;
      case 3:
        if(ratio > 1.8){ rows=1; cols=3; }
        else if(ratio > 0.8){ rows=1; cols=3; }
        else { rows=3; cols=1; }
        break;
      case 4:
        // 4 页固定横向单排。宽度放不下时不再折成四宫格，
        // 改为保持页面尺寸并由容器横向滚动（见 renderScreen 里的 hscroll 分支）。
        rows=1; cols=4;
        break;
      case 6:
        if(ratio > 1.5){ rows=2; cols=3; }
        else { rows=3; cols=2; }
        break;
      default: rows=1; cols=pageCount;
    }
    return {rows, cols};
  },

  /* 渲染当前屏。
     opts.preserveScroll = true 时保留滚动位置（窗口缩放、缩放倍率变化用），默认回到屏首。
     本函数会等本屏所有页面真正渲染完成才 resolve —— 自动滚动靠 scrollHeight 判断"是否到底"，
     页面尚未撑开高度时会被误判成"已到底"从而连续跳页。 */
  async renderScreen(opts){
    const preserveScroll = !!(opts && opts.preserveScroll);
    const token = ++State.renderToken;        // 作废仍在飞行中的旧渲染任务
    const container = document.getElementById('pages-container');
    const prevScroll = container.scrollTop;
    State.screenReady = false;
    State.hScrollable = false;

    // 同屏页数受当前谱子总页数限制
    RenderModule.updatePagesCountButtons();

    container.innerHTML = '';
    State.renderedSlots = [];

    if(!State.currentSong || State.currentSong.pages.length === 0){
      document.getElementById('empty-state').style.display = State.songs.length === 0 ? 'flex' : 'none';
      State.screenReady = true;
      UIModule.updateStatusBar();
      return;
    }
    document.getElementById('empty-state').style.display = 'none';

    const pages = State.currentSong.pages;
    const startIdx = State.currentScreen * State.pagesPerScreen;
    const screenPages = pages.slice(startIdx, startIdx + State.pagesPerScreen);

    if(screenPages.length === 0){ State.screenReady = true; return; }

    const GAP = 2;                 // 与 CSS 的 gap 保持一致
    let slotSizes = null;          // 每页的实际显示尺寸

    {
      /* 先取本屏每页的宽高比，按"等比放进各自格子"算出实际显示尺寸，
         再让它们紧挨着整体居中。旧实现用 repeat(cols,1fr) 把每页撑成等宽列，
         纵向页面横向填不满列宽，两页之间就会空出一大块。 */
      const n = State.pagesPerScreen;
      const cs = getComputedStyle(container);
      const availW = Math.max(1, container.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
      const availH = Math.max(1, container.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
      const {rows, cols} = RenderModule.calculateLayout(n, availW, availH);

      const aspects = await Promise.all(screenPages.map(p => RenderModule.getPageAspect(p)));
      if(token !== State.renderToken) return;   // 量比例的期间又切屏了，交给新那一次收尾

      // 宽排：单行且列数 >= 4。此时页面按"高度铺满"定尺寸，宽度不够就横向滚动，
      // 不再为了塞进屏幕把谱面缩小（4 页被压成一排小图很难看）。
      const wide = rows === 1 && cols >= 4;
      let overflow = false;

      if(wide){
        // 预留一点高度给横向滚动条，避免页面底部被裁掉
        const usableH = Math.max(1, availH - 12);
        slotSizes = aspects.map(a=>({
          w: Math.max(1, Math.round(usableH * a)),
          h: Math.max(1, Math.round(usableH)),
        }));
        const totalW = slotSizes.reduce((s,x)=>s+x.w, 0) + GAP * (slotSizes.length - 1);
        overflow = totalW > availW;
      } else {
        const cellW = Math.max(1, (availW - GAP * (cols - 1)) / cols);
        const cellH = Math.max(1, (availH - GAP * (rows - 1)) / rows);
        slotSizes = aspects.map(a=>{
          const h = Math.min(cellH, cellW / a);
          return { w: Math.max(1, Math.round(h * a)), h: Math.max(1, Math.round(h)) };
        });
      }

      // 溢出时用 start 对齐：居中会让左半部分滚不到
      State.hScrollable = overflow;
      container.className = 'fit-boxes' + (overflow ? ' hscroll' : '');
      container.style.justifyContent = overflow ? 'start' : 'center';
      container.style.gridTemplateRows = `repeat(${rows}, auto)`;
      container.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    }

    // 创建页面槽位
    const tasks = [];
    for(let i=0; i<screenPages.length; i++){
      const pageRef = screenPages[i];
      const slot = document.createElement('div');
      slot.className = 'page-slot';
      slot.dataset.pageIndex = startIdx + i;
      if(slotSizes){
        slot.style.width = slotSizes[i].w + 'px';
        slot.style.height = slotSizes[i].h + 'px';
      }
      container.appendChild(slot);
      State.renderedSlots.push(slot);

      // 异步渲染页面内容，同时收集任务以便等待全部完成
      tasks.push(
        RenderModule.renderPage(pageRef, slot, token).catch(err=>{
          // 只给仍然有效、且还挂在文档里的槽位写错误提示
          if(token !== State.renderToken || !slot.isConnected) return;
          slot.innerHTML = `<div class="page-error">⚠ ${Utils.escapeHtml(err.message||'渲染失败')}</div>`;
        })
      );
    }

    // 预加载下一屏的 PDF
    const nextStart = startIdx + State.pagesPerScreen;
    if(nextStart < pages.length){
      const nextPages = pages.slice(nextStart, nextStart + State.pagesPerScreen);
      for(const np of nextPages){
        if(np.type === 'pdf'){
          RenderModule.ensurePdfLoaded(np.fileId).catch(()=>{});
        }
      }
    }

    UIModule.updateStatusBar();

    await Promise.all(tasks);
    if(token !== State.renderToken) return;   // 期间又触发了新渲染，收尾交给新那一次

    State.screenReady = true;
    container.scrollTop = preserveScroll ? prevScroll : 0;
  },

  async renderPage(pageRef, slot, token){
    if(pageRef.type === 'image'){
      await RenderModule.renderImagePage(pageRef, slot, token);
    } else if(pageRef.type === 'pdf'){
      await RenderModule.renderPDFPage(pageRef, slot, token);
    }
  },

  // 取图片的 objectURL（带缓存，统一释放见 cleanupAllResources）
  async ensureObjectURL(fileId){
    let url = State.objectURLs.get(fileId);
    if(!url){
      const fileRecord = await DB.getFile(fileId);
      if(!fileRecord) throw new Error('文件不存在');
      url = URL.createObjectURL(fileRecord.blob);
      State.objectURLs.set(fileId, url);
    }
    return url;
  },

  /* 取某一页的宽高比（w/h）。已知的会缓存，避免每次重排都重新解码。
     拿不到时退回 A4 纵向比例，至少不会把布局搞坏。 */
  async getPageAspect(pageRef){
    const key = pageRef.type + ':' + pageRef.fileId + ':' + (pageRef.pageIndex || 0);
    const cached = State.pageAspect.get(key);
    if(cached) return cached;

    let aspect = 0.707;   // A4 纵向兜底
    try{
      if(pageRef.type === 'image'){
        const url = await RenderModule.ensureObjectURL(pageRef.fileId);
        const size = await new Promise(resolve=>{
          const probe = new Image();
          probe.onload = ()=>resolve({ w: probe.naturalWidth, h: probe.naturalHeight });
          probe.onerror = ()=>resolve(null);
          probe.src = url;
        });
        if(size && size.w > 0 && size.h > 0) aspect = size.w / size.h;
      } else if(pageRef.type === 'pdf'){
        const pdf = await RenderModule.ensurePdfLoaded(pageRef.fileId);
        const page = await pdf.getPage(pageRef.pageIndex + 1);
        const vp = page.getViewport({scale: 1});
        if(vp.width > 0 && vp.height > 0) aspect = vp.width / vp.height;
      }
    }catch(e){ /* 用兜底比例 */ }

    State.pageAspect.set(key, aspect);
    return aspect;
  },

  async renderImagePage(pageRef, slot, token){
    const url = await RenderModule.ensureObjectURL(pageRef.fileId);
    const img = document.createElement('img');
    img.src = url;
    img.alt = '谱面';
    // 等解码完成再落位：否则槽位高度为 0，自动滚动会误判成"已到底"而跳过本页
    await new Promise(resolve=>{
      if(img.complete){ resolve(); return; }
      img.onload = ()=>resolve();
      img.onerror = ()=>resolve();
    });
    if(token !== State.renderToken || !slot.isConnected) return;
    const err = slot.querySelector('.page-error');
    if(err) err.remove();
    slot.appendChild(img);
  },

  async renderPDFPage(pageRef, slot, token){
    // ensurePdfLoaded 内部会按需等待 pdf.js 就绪并给出明确错误
    const pdf = await RenderModule.ensurePdfLoaded(pageRef.fileId);
    const page = await pdf.getPage(pageRef.pageIndex + 1);

    const dpr = window.devicePixelRatio || 1;
    const slotW = slot.clientWidth || 400;
    const slotH = slot.clientHeight || 600;

    const baseViewport = page.getViewport({scale:1});
    // 等比放进槽位（槽位已按页面宽高比预先算好，这里基本等于正好铺满）
    let scale = Math.min(slotW / baseViewport.width, slotH / baseViewport.height);
    scale = Math.max(0.1, scale);

    const viewport = page.getViewport({scale: scale * dpr});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = (viewport.width / dpr) + 'px';
    canvas.style.height = (viewport.height / dpr) + 'px';

    const ctx = canvas.getContext('2d');
    await page.render({canvasContext: ctx, viewport}).promise;

    // 渲染期间可能已经切屏/切歌，过期结果直接丢弃，不要往已卸载的槽位塞节点
    if(token !== State.renderToken || !slot.isConnected) return;

    const err = slot.querySelector('.page-error');
    if(err) err.remove();
    slot.appendChild(canvas);
  },

  async ensurePdfLoaded(fileId){
    if(State.pdfDocCache.has(fileId)){
      return State.pdfDocCache.get(fileId);
    }
    const lib = await PdfLib.get();          // 按需等待依赖，自带超时
    if(!lib) throw new Error('PDF 组件不可用，请检查网络后刷新页面');
    const fileRecord = await DB.getFile(fileId);
    if(!fileRecord) throw new Error('PDF文件不存在');
    const buf = await fileRecord.blob.arrayBuffer();
    const pdf = await lib.getDocument({data: buf}).promise;
    State.pdfDocCache.set(fileId, pdf);
    return pdf;
  },

  cleanupAllResources(){
    // 先让仍在飞行中的渲染任务失效，避免它们继续往已销毁的文档/已卸载的节点上操作
    State.renderToken++;

    // 释放 objectURLs
    for(const url of State.objectURLs.values()){
      try{ URL.revokeObjectURL(url); }catch(e){}
    }
    State.objectURLs.clear();

    // 销毁 PDF 文档
    for(const pdf of State.pdfDocCache.values()){
      try{ pdf.destroy(); }catch(e){}
    }
    State.pdfDocCache.clear();

    // 停止定时翻页
    PagingModule.stopTimedPaging();
  },

  /* 同屏页数按钮的可用性：超过当前谱子总页数的档位置灰且不可点。
     例如 2 页的谱子，3 / 4 / 6 都应该点不了。
     没有选中歌曲时不做限制（此时也没有"页数"可参照）。 */
  updatePagesCountButtons(){
    const total = State.currentSong ? (State.currentSong.pages || []).length : 0;
    document.querySelectorAll('#pages-count-group button').forEach(b=>{
      const n = parseInt(b.dataset.count);
      const blocked = total > 0 && n > total;
      b.disabled = blocked;
      b.title = blocked ? `当前谱子共 ${total} 页，无法 ${n} 页同屏` : '';
    });
  },

  /* 打开新谱子时把同屏页数收敛到合法档位，
     否则从一首 10 页的歌切到 2 页的歌会留下"6 页同屏"的无效状态。 */
  clampPagesPerScreen(){
    const total = State.currentSong ? (State.currentSong.pages || []).length : 0;
    if(total <= 0 || State.pagesPerScreen <= total) return;
    const allowed = [1,2,3,4,6].filter(v=>v <= total);
    State.pagesPerScreen = allowed.length ? allowed[allowed.length - 1] : 1;
    localStorage.setItem('gsr_pagesPerScreen', State.pagesPerScreen);
    document.querySelectorAll('#pages-count-group button').forEach(b=>{
      b.classList.toggle('active', parseInt(b.dataset.count) === State.pagesPerScreen);
    });
  },

  setPagesPerScreen(n){
    // 超出总页数的档位直接拒绝（按钮已置灰，这里再兜一层，快捷键也走同一条路径）
    const total = State.currentSong ? (State.currentSong.pages || []).length : 0;
    if(total > 0 && n > total){
      Utils.toast(`当前谱子共 ${total} 页，无法 ${n} 页同屏`,'warning',1500);
      return;
    }
    const oldN = State.pagesPerScreen || 1;
    // 切换前正在看的那一页，切换后必须仍落在视野内。
    // 旧实现先把新的 pagesPerScreen 写进 State，再算 floor(screen * n / n)，
    // 结果恒等于原屏号，等于换算完全没生效，会跳到很远的页。
    const firstPage = State.currentScreen * oldN;
    State.pagesPerScreen = n;
    State.currentScreen = Math.floor(firstPage / n);
    if(State.currentSong){
      const maxScreen = Math.max(0, Math.ceil(State.currentSong.pages.length / n) - 1);
      if(State.currentScreen > maxScreen) State.currentScreen = maxScreen;
    }
    document.querySelectorAll('#pages-count-group button').forEach(b=>{
      b.classList.toggle('active', parseInt(b.dataset.count) === n);
    });
    localStorage.setItem('gsr_pagesPerScreen', n);
    RenderModule.renderScreen();
  },

  handleWheel(e){
    if(e.ctrlKey) return;    // 已移除 ctrl+滚轮缩放
    // 宽排模式下没有纵向可滚的空间，把滚轮转成横向滚动，避免用户以为卡住了
    if(State.hScrollable){
      const c = document.getElementById('pages-container');
      if(c.scrollWidth > c.clientWidth){
        e.preventDefault();
        c.scrollLeft += (e.deltaY || 0);
      }
    }
  },

  toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(err=>{
        Utils.toast('无法进入全屏：'+err.message,'error');
      });
    } else {
      document.exitFullscreen();
    }
  },

  handleResize(){
    UIModule.syncSidebarBackdrop();
    if(State.resizeTimer) clearTimeout(State.resizeTimer);
    State.resizeTimer = setTimeout(()=>{
      // 保留滚动位置：否则窗口尺寸变化（含侧栏收放）会把阅读进度打回屏首
      RenderModule.renderScreen({preserveScroll:true});
    }, 200);
  },
};

/* ==================== 翻页与定时翻页模块 ==================== */
const PagingModule = {

  TIMER_MIN: 3,          // 定时翻页间隔（秒）上下限
  TIMER_MAX: 120,

  nextScreen(){
    if(!State.currentSong) return;
    PagingModule.pauseAutoMode();
    const maxScreen = Math.max(0, Math.ceil(State.currentSong.pages.length / State.pagesPerScreen) - 1);
    if(State.currentScreen >= maxScreen){
      PagingModule.nextSong();
    } else {
      State.currentScreen++;
      RenderModule.renderScreen();
      PagingModule.savePosition();
    }
  },

  prevScreen(){
    if(!State.currentSong) return;
    PagingModule.pauseAutoMode();
    if(State.currentScreen <= 0){
      PagingModule.prevSong();
    } else {
      State.currentScreen--;
      RenderModule.renderScreen();
      PagingModule.savePosition();
    }
  },

  nextSong(){
    if(!State.currentSong) return;
    const filtered = LibraryModule.getFilteredSongs();
    const idx = filtered.findIndex(s=>s.id === State.currentSong.id);
    if(idx >= 0 && idx < filtered.length - 1){
      PagingModule.openSong(filtered[idx+1].id, 0);
      Utils.toast('已切换到下一首：'+filtered[idx+1].title,'info',1500);
    } else {
      Utils.toast('已经是最后一首了','info',1500);
    }
  },

  prevSong(){
    if(!State.currentSong) return;
    const filtered = LibraryModule.getFilteredSongs();
    const idx = filtered.findIndex(s=>s.id === State.currentSong.id);
    if(idx > 0){
      PagingModule.openSong(filtered[idx-1].id, 0);
      Utils.toast('已切换到上一首：'+filtered[idx-1].title,'info',1500);
    } else {
      Utils.toast('已经是第一首了','info',1500);
    }
  },

  async openSong(songId, screen=0){
    const song = await DB.getSong(songId);
    if(!song){ Utils.toast('歌曲不存在','error'); return; }

    RenderModule.cleanupAllResources();

    State.currentSong = song;
    RenderModule.clampPagesPerScreen();   // 同屏页数不能超过这首谱子的总页数
    const maxScreen = Math.max(0, Math.ceil(song.pages.length / State.pagesPerScreen) - 1);
    State.currentScreen = Math.min(Math.max(0, screen || 0), maxScreen);
    song.lastOpenedAt = Date.now();
    await DB.saveSong(song);

    // 同步内存列表，否则"按最近打开"排序和"x 分钟前"不会随打开动作刷新
    const idx = State.songs.findIndex(s=>s.id === songId);
    if(idx >= 0) State.songs[idx] = song;
    else State.songs.push(song);

    await RenderModule.renderScreen();
    UIModule.updateToolbar();
    LibraryModule.renderSongList();   // 内部会带上当前项高亮

    document.getElementById('append-btn').style.display = '';
    PagingModule.savePosition();
    // 移动端：选完歌就收起侧栏，把屏幕让给谱面
    UIModule.closeSidebarOnMobile();
  },

  savePosition(){
    if(State.currentSong){
      localStorage.setItem('gsr_lastSongId', State.currentSong.id);
      localStorage.setItem('gsr_lastScreen', State.currentScreen);
    }
  },

  // 定时翻页：开启 / 暂停 / 恢复
  toggleTimedPaging(){
    if(!State.currentSong){ Utils.toast('请先选择歌曲','warning'); return; }
    const t = State.timedPaging;
    if(t.active && !t.paused){
      t.paused = true;
      if(t.rafId) cancelAnimationFrame(t.rafId);
      document.getElementById('timer-btn').classList.remove('active');
      document.getElementById('countdown-ring').classList.remove('show');
      Utils.toast('定时翻页已暂停','info',1500);
    } else if(t.active && t.paused){
      t.paused = false;
      t.remaining = t.interval;
      t.lastTime = 0;
      t.rafId = requestAnimationFrame(PagingModule.timerStep);
      document.getElementById('timer-btn').classList.add('active');
      document.getElementById('countdown-ring').classList.add('show');
      Utils.toast('定时翻页已恢复','info',1500);
    } else {
      t.active = true;
      t.paused = false;
      t.remaining = t.interval;
      t.lastTime = 0;
      t.rafId = requestAnimationFrame(PagingModule.timerStep);
      document.getElementById('timer-btn').classList.add('active');
      document.getElementById('countdown-ring').classList.add('show');
      Utils.toast(`定时翻页已启动 (${t.interval}s)`,'success',1500);
    }
  },

  stopTimedPaging(){
    const t = State.timedPaging;
    t.active = false;
    t.paused = false;
    if(t.rafId){ cancelAnimationFrame(t.rafId); t.rafId = null; }
    document.getElementById('timer-btn').classList.remove('active');
    document.getElementById('countdown-ring').classList.remove('show');
  },

  timerStep(timestamp){
    const t = State.timedPaging;
    if(!t.active || t.paused) return;

    if(!t.lastTime) t.lastTime = timestamp;
    const delta = (timestamp - t.lastTime) / 1000;
    t.lastTime = timestamp;
    t.remaining -= delta;

    const circumference = 2 * Math.PI * 24;
    const progress = Math.max(0, t.remaining / t.interval);
    document.getElementById('ring-fg').style.strokeDashoffset = circumference * (1 - progress);
    document.getElementById('countdown-text').textContent = Math.ceil(Math.max(0, t.remaining));

    if(t.remaining <= 0){
      t.remaining = t.interval;
      PagingModule.nextScreenTimed();
    }

    t.rafId = requestAnimationFrame(PagingModule.timerStep);
  },

  nextScreenTimed(){
    if(!State.currentSong) return;
    const maxScreen = Math.max(0, Math.ceil(State.currentSong.pages.length / State.pagesPerScreen) - 1);
    if(State.currentScreen >= maxScreen){
      PagingModule.nextSong();
    } else {
      State.currentScreen++;
      RenderModule.renderScreen();
      PagingModule.savePosition();
    }
  },

  // 手动翻页时暂停倒计时，避免刚翻过去又被定时器翻走
  pauseAutoMode(){
    if(State.timedPaging.active && !State.timedPaging.paused){
      State.timedPaging.paused = true;
      if(State.timedPaging.rafId) cancelAnimationFrame(State.timedPaging.rafId);
      document.getElementById('timer-btn').classList.remove('active');
      document.getElementById('countdown-ring').classList.remove('show');
    }
  },

  handleSpacebar(){
    if(State.timedPaging.active) PagingModule.toggleTimedPaging();   // 定时翻页中 → 暂停/恢复
    else PagingModule.nextScreen();
  },

  /* 设定定时翻页的间隔（秒）。来自工具栏的输入框，也可能被外部调用。
     会写回输入框本身，保证界面显示与实际值一致（比如输入 999 被夹到 120）。 */
  setTimerInterval(seconds){
    const t = State.timedPaging;
    t.interval = Utils.clamp(Math.round(Number(seconds) || t.interval), PagingModule.TIMER_MIN, PagingModule.TIMER_MAX);
    localStorage.setItem('gsr_timerInterval', t.interval);

    const input = document.getElementById('timer-interval-input');
    if(input && Number(input.value) !== t.interval) input.value = t.interval;

    // 正在倒计时的话，立刻按新间隔重新计时，让改动马上生效
    if(t.active && !t.paused) t.remaining = t.interval;

    Utils.toast(`定时翻页间隔：${t.interval} 秒`,'info',1200);
    return t.interval;
  },
};

/* ==================== 曲库管理模块 ==================== */
const LibraryModule = {

  async refresh(){
    State.songs = await DB.getAllSongs();
    LibraryModule.renderSongList();
    LibraryModule.renderTagBar();
    UIModule.updateStatusBar();
  },

  getFilteredSongs(){
    let songs = [...State.songs];

    const q = State.searchQuery.toLowerCase().trim();
    if(q){
      songs = songs.filter(s=>
        (s.title||'').toLowerCase().includes(q) ||
        (s.artist||'').toLowerCase().includes(q) ||
        (s.tags||[]).some(t=>t.toLowerCase().includes(q))
      );
    }

    if(State.activeTag){
      songs = songs.filter(s=>(s.tags||[]).includes(State.activeTag));
    }

    const sortBy = State.sortBy;
    songs.sort((a,b)=>{
      if(a.favorite && !b.favorite) return -1;
      if(!a.favorite && b.favorite) return 1;
      let av, bv;
      switch(sortBy){
        case 'title': av=a.title||''; bv=b.title||''; return av.localeCompare(bv,'zh');
        case 'artist': av=a.artist||''; bv=b.artist||''; return av.localeCompare(bv,'zh');
        case 'lastOpenedAt': av=a.lastOpenedAt||0; bv=b.lastOpenedAt||0; return bv-av;
        case 'createdAt':
        default: av=a.createdAt||0; bv=b.createdAt||0; return bv-av;
      }
    });

    return songs;
  },

  // 【修复2】歌曲列表 - 增加编辑按钮
  renderSongList(){
    const list = document.getElementById('song-list');
    const songs = LibraryModule.getFilteredSongs();

    // 设置多选模式 class
    if(State.multiSelectMode){
      list.classList.add('multi-select');
    } else {
      list.classList.remove('multi-select');
    }

    if(songs.length === 0){
      list.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">暂无歌曲，点击下方导入按钮添加</li>';
      return;
    }

    // 全部走事件委托（见 bindEvents 里对 #song-list 的监听），
    // 不再把 id 拼进内联 onclick 字符串里，避免 id/文本里的引号破坏 HTML
    list.innerHTML = songs.map(s=>{
      const isSelected = State.selectedSongs.has(s.id);
      return `
      <li class="song-item ${State.currentSong && s.id===State.currentSong.id ? 'active':''} ${isSelected?'selected':''}" data-id="${Utils.escapeHtml(s.id)}">
        <span class="song-checkbox ${isSelected?'checked':''}" data-act="select" title="选择"></span>
        <span class="star-btn ${s.favorite?'starred':''}" data-act="fav">${s.favorite?'★':'☆'}</span>
        <div class="song-info" data-act="open">
          <div class="song-title">${Utils.escapeHtml(s.title)}</div>
          <div class="song-meta">${Utils.escapeHtml(s.artist||'未知歌手')}</div>
        </div>
        <span class="song-pages">${(s.pages||[]).length}页</span>
        <span class="edit-btn" data-act="edit" title="编辑">✎</span>
      </li>
    `}).join('');
    
    // 更新多选信息
    LibraryModule.updateMultiSelectInfo();
  },

  // 曲库列表的点击分发（由 #song-list 上的委托监听调用）
  handleListClick(e){
    const item = e.target.closest('.song-item');
    if(!item) return;
    const songId = item.dataset.id;
    if(!songId) return;

    const hit = e.target.closest('[data-act]');
    const act = hit ? hit.dataset.act : null;

    if(act === 'select'){ LibraryModule.toggleSelect(songId); return; }
    if(act === 'fav'){
      LibraryModule.toggleFavorite(songId).catch(err=>Utils.toast('操作失败：'+(err.message||err),'error'));
      return;
    }
    if(act === 'edit'){ LibraryModule.editSong(songId); return; }
    // 其余区域：多选模式下切换选中，否则打开歌曲
    if(State.multiSelectMode){
      LibraryModule.toggleSelect(songId);
    } else {
      // 委托处理器不是 async，这里必须自己兜住 promise，否则失败会变成未捕获的 rejection
      PagingModule.openSong(songId).catch(err=>Utils.toast('打开失败：'+(err.message||err),'error'));
    }
  },

  // 标签栏的点击分发（由 #tag-bar 上的委托监听调用）
  handleTagClick(e){
    const chip = e.target.closest('.tag-chip');
    if(!chip) return;
    LibraryModule.toggleTag(chip.dataset.tag);
  },

  // 切换多选模式
  toggleMultiSelect(){
    State.multiSelectMode = !State.multiSelectMode;
    if(!State.multiSelectMode){
      State.selectedSongs.clear();
    }
    document.getElementById('multi-select-bar').classList.toggle('show', State.multiSelectMode);
    document.getElementById('multiselect-btn').classList.toggle('active', State.multiSelectMode);
    LibraryModule.renderSongList();
  },

  // 退出多选模式
  exitMultiSelect(){
    State.multiSelectMode = false;
    State.selectedSongs.clear();
    document.getElementById('multi-select-bar').classList.remove('show');
    document.getElementById('multiselect-btn').classList.remove('active');
    LibraryModule.renderSongList();
  },

  // 切换单个歌曲的选中状态
  toggleSelect(songId){
    if(State.selectedSongs.has(songId)){
      State.selectedSongs.delete(songId);
    } else {
      State.selectedSongs.add(songId);
    }
    LibraryModule.renderSongList();
  },

  // 全选（当前过滤后的列表）——"全选"语义是选中全部可见项，不是叠加
  selectAll(){
    const songs = LibraryModule.getFilteredSongs();
    State.selectedSongs.clear();
    for(const s of songs){
      State.selectedSongs.add(s.id);
    }
    LibraryModule.renderSongList();
  },

  // 取消全选
  deselectAll(){
    State.selectedSongs.clear();
    LibraryModule.renderSongList();
  },

  // 更新多选信息显示
  updateMultiSelectInfo(){
    const info = document.getElementById('ms-info');
    if(info){
      const count = State.selectedSongs.size;
      info.textContent = `已选 ${count} 首`;
    }
  },

  // 确认批量删除
  confirmBatchDelete(){
    const count = State.selectedSongs.size;
    if(count === 0){
      Utils.toast('请先选择要删除的歌曲','warning');
      return;
    }
    const html = `
      <h2>确认批量删除</h2>
      <p class="modal-subtitle">此操作不可撤销，将删除选中的 ${count} 首歌曲及其所有文件数据</p>
      <div style="padding:16px;background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:16px">
        <strong style="color:var(--danger)">⚠ 即将删除 ${count} 首歌曲</strong>
        <br><span style="color:var(--text-muted);font-size:12px">删除后无法恢复，请确认已备份重要数据</span>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="UIModule.closeModal()">取消</button>
        <button class="btn-danger" onclick="LibraryModule.doBatchDelete()">确认删除 ${count} 首</button>
      </div>
    `;
    UIModule.showModal(html);
  },

  // 执行批量删除
  async doBatchDelete(){
    const ids = Array.from(State.selectedSongs);
    UIModule.closeModal();
    UIModule.showProgress('正在批量删除...');
    
    let deleted = 0;
    let failed = 0;
    const total = ids.length;
    
    try{
      for(let i=0; i<ids.length; i++){
        const songId = ids[i];
        try{
          await DB.deleteFilesBySongId(songId);
          await DB.deleteSong(songId);
          deleted++;
        }catch(err){
          console.error('删除失败:', songId, err);
          failed++;
        }
        UIModule.updateProgress(i+1, total);
        if(i % 5 === 0) await new Promise(r=>setTimeout(r, 0));
      }
      
      // 从内存列表中移除已删除的歌曲
      State.songs = State.songs.filter(s=>!State.selectedSongs.has(s.id));
      
      // 检查当前歌曲是否在被删除的列表中
      if(State.currentSong && State.selectedSongs.has(State.currentSong.id)){
        State.currentSong = null;
        State.currentScreen = 0;
        RenderModule.cleanupAllResources();
        RenderModule.renderScreen();
        UIModule.updateToolbar();
        document.getElementById('append-btn').style.display = 'none';
        localStorage.removeItem('gsr_lastSongId');
        localStorage.removeItem('gsr_lastScreen');
      }
      
      // 清空选中状态并退出多选模式
      State.selectedSongs.clear();
      State.multiSelectMode = false;
      document.getElementById('multi-select-bar').classList.remove('show');
      document.getElementById('multiselect-btn').classList.remove('active');
      
      UIModule.hideProgress();
      let msg = `成功删除 ${deleted} 首歌曲`;
      if(failed > 0) msg += `（${failed} 首删除失败）`;
      Utils.toast(msg, 'success');
      LibraryModule.renderSongList();
      LibraryModule.renderTagBar();
    }catch(err){
      UIModule.hideProgress();
      LibraryModule.renderSongList();
      Utils.toast('批量删除失败：'+(err.message||err),'error');
    }
  },

  renderTagBar(){
    const tagBar = document.getElementById('tag-bar');
    const tagSet = new Set();
    for(const s of State.songs){
      (s.tags||[]).forEach(t=>tagSet.add(t));
    }
    const tags = Array.from(tagSet).sort();
    if(tags.length === 0){
      tagBar.innerHTML = '';
      return;
    }
    // 用 data-tag 承载标签值 + 事件委托，标签里出现引号也不会破坏 DOM
    tagBar.innerHTML = tags.map(t=>
      `<span class="tag-chip ${State.activeTag===t?'active':''}" data-tag="${Utils.escapeHtml(t)}" title="${Utils.escapeHtml(t)}">${Utils.escapeHtml(t)}</span>`
    ).join('');
  },

  toggleTag(tag){
    if(tag === undefined || tag === null) return;
    State.activeTag = State.activeTag === tag ? null : tag;
    LibraryModule.renderSongList();
    LibraryModule.renderTagBar();
  },

  async toggleFavorite(songId){
    const song = await DB.getSong(songId);
    if(!song) return;
    song.favorite = !song.favorite;
    await DB.saveSong(song);
    const idx = State.songs.findIndex(s=>s.id===songId);
    if(idx >= 0) State.songs[idx] = song;
    LibraryModule.renderSongList();
    if(State.currentSong && State.currentSong.id === songId){
      State.currentSong = song;
      UIModule.updateToolbar();
    }
  },

  async toggleFavoriteCurrent(){
    if(!State.currentSong) return;
    await LibraryModule.toggleFavorite(State.currentSong.id);
  },

  // 【修复2】编辑歌曲信息
  editSong(songId){

  async saveEdit(songId){
    const song = await DB.getSong(songId);
    if(!song) return;
    song.title = document.getElementById('edit-title').value.trim() || '未命名';
    song.artist = document.getElementById('edit-artist').value.trim();

      LibraryModule.renderTagBar();
      UIModule.updateToolbar();

      Utils.toast('保存失败：'+err.message,'error');

  confirmDelete(songId){
    const song = State.songs.find(s=>s.id===songId);
    if(!song) return;
    const sid = Utils.jsId(song.id);
    const html = `
      <h2>确认删除</h2>
      <p class="modal-subtitle">此操作不可撤销，将删除歌曲及其所有文件数据</p>
      <div style="padding:16px;background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:16px">
        <strong>${Utils.escapeHtml(song.title)}</strong>
        ${song.artist ? '<br><span style="color:var(--text-muted)">'+Utils.escapeHtml(song.artist)+'</span>' : ''}
        <br><span style="color:var(--text-muted);font-size:12px">${(song.pages||[]).length} 页</span>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="LibraryModule.editSong('${sid}')">返回</button>
        <button class="btn-danger" onclick="LibraryModule.doDelete('${sid}')">确认删除</button>
      </div>
    `;
    UIModule.showModal(html);
  },

  async doDelete(songId){
    // 先从内存中取出歌曲对象（用于提示文案），避免后续引用未定义变量
    const song = State.songs.find(s=>s.id===songId);
    const songTitle = song ? song.title : '未知歌曲';
    try{
      await DB.deleteFilesBySongId(songId);
      await DB.deleteSong(songId);

      // 从内存列表中移除
      State.songs = State.songs.filter(s=>s.id!==songId);
      
      // 如果删除的是当前正在查看的歌曲，清理显示区
      if(State.currentSong && State.currentSong.id === songId){
        State.currentSong = null;
        State.currentScreen = 0;
        RenderModule.cleanupAllResources();
        RenderModule.renderScreen();
        UIModule.updateToolbar();
        document.getElementById('append-btn').style.display = 'none';

      }

      LibraryModule.renderSongList();
      LibraryModule.renderTagBar();
