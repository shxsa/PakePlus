      LibraryModule.renderSongList();
      Utils.toast('删除失败：'+(err.message||err),'error');
    }
  },
};

/* ==================== 备份与恢复模块 ==================== */
const BackupModule = {

  async backup(){
    if(typeof JSZip === 'undefined'){
      Utils.toast('JSZip 未加载，无法备份','error');
      return;
    }
    const songs = await DB.getAllSongs();
    if(songs.length === 0){
      Utils.toast('曲库为空，无需备份','warning');
      return;
    }

    UIModule.showProgress('正在打包备份...');

    try{
      const zip = new JSZip();
      const manifest = {
        version: 1,
        exportDate: new Date().toISOString(),
        songs: [],
      };

      const allFiles = await DB.getAllFiles();
      const fileMap = new Map();
      for(const f of allFiles){
        fileMap.set(f.fileId, f);
      }

      let processed = 0;
      const total = songs.length;

      for(const song of songs){
        const songManifest = {
          id: song.id,
          title: song.title,
          artist: song.artist,
          tags: song.tags || [],
          key: song.key || '',
          capo: song.capo || 0,
          note: song.note || '',
          favorite: song.favorite || false,
          createdAt: song.createdAt,
          lastOpenedAt: song.lastOpenedAt,
          pages: [],
        };

        for(const page of song.pages){
          const file = fileMap.get(page.fileId);
          if(!file){
            songManifest.pages.push({...page, missing:true});
            continue;
          }

          const safeName = BackupModule.sanitizeFileName(file.name);
          const zipPath = `${song.id}/${safeName}`;
          if(!zip.file('songs/'+zipPath)){
            const blob = await file.blob;
            zip.file('songs/'+zipPath, blob);
          }

          songManifest.pages.push({
            type: page.type,
            fileId: page.fileId,
            pageIndex: page.pageIndex,
            fileName: file.name,
            mimeType: file.mimeType,
            zipPath: zipPath,
          });
        }

        manifest.songs.push(songManifest);
        processed++;
        UIModule.updateProgress(processed, total);
        if(processed % 5 === 0) await new Promise(r=>setTimeout(r,0));
      }

      zip.file('manifest.json', JSON.stringify(manifest, null, 2));

      UIModule.updateProgressTitle('正在压缩...');
      const content = await zip.generateAsync({type:'blob', compression:'DEFLATE'}, (meta)=>{
        UIModule.updateProgressTitle(`正在压缩... ${Math.round(meta.percent)}%`);
      });

      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = `吉他谱备份_${new Date().toISOString().slice(0,10)}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);

      UIModule.hideProgress();
      Utils.toast(`备份完成：${songs.length} 首歌曲`,'success');
      localStorage.setItem('gsr_lastBackup', Date.now());
    }catch(err){
      UIModule.hideProgress();
      Utils.toast('备份失败：'+err.message,'error',5000);
      console.error(err);
    }
  },

  sanitizeFileName(name){
    return name.replace(/[^a-zA-Z0-9._\-\u4e00-\u9fa5]/g, '_');
  },

  async restore(){
    if(typeof JSZip === 'undefined'){
      Utils.toast('JSZip 未加载，无法恢复','error');
      return;
    }
    document.getElementById('restore-input').value = '';
    document.getElementById('restore-input').click();
  },

  async handleRestore(event){
    const file = event.target.files[0];
    if(!file) return;

    UIModule.showProgress('正在读取备份...');

    try{
      const zip = await JSZip.loadAsync(file);
      const manifestFile = zip.file('manifest.json');
      if(!manifestFile){
        UIModule.hideProgress();
        Utils.toast('无效的备份文件：缺少 manifest.json','error');
        return;
      }

      const manifestText = await manifestFile.async('text');
      const manifest = JSON.parse(manifestText);

      if(!manifest.version || manifest.version > 2){
        UIModule.hideProgress();
        Utils.toast('不支持的备份版本','error');
        return;
      }

      BackupModule.showRestoreConfirm(manifest, zip);
    }catch(err){
      UIModule.hideProgress();
      Utils.toast('读取备份失败：'+err.message,'error');
      console.error(err);
    }
  },

  showRestoreConfirm(manifest, zip){
    const html = `
      <h2>恢复备份</h2>
      <p class="modal-subtitle">备份包含 ${manifest.songs.length} 首歌曲，导出于 ${new Date(manifest.exportDate).toLocaleString('zh-CN')}</p>
      <div class="form-group">
        <label>恢复模式</label>
        <select id="restore-mode">
          <option value="merge">合并（保留现有歌曲，跳过重复）</option>
          <option value="overwrite">覆盖（清空现有歌曲后恢复）</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="UIModule.closeModal()">取消</button>
        <button class="btn-primary" onclick="BackupModule.executeRestore()">开始恢复</button>
      </div>
    `;
    State._restoreManifest = manifest;
    State._restoreZip = zip;
    UIModule.showModal(html);
  },

  async executeRestore(){
    const mode = document.getElementById('restore-mode').value;
    const manifest = State._restoreManifest;
    const zip = State._restoreZip;
    UIModule.closeModal();

    UIModule.showProgress('正在恢复...');

    try{
      if(mode === 'overwrite'){
        await DB.clearAll();
        State.songs = [];
        State.currentSong = null;
        RenderModule.cleanupAllResources();
      }

      let processed = 0;
      const total = manifest.songs.length;
      let importedSongs = 0;
      let missingFiles = 0;
      const missingReport = [];

      for(const songM of manifest.songs){
        const songId = (mode === 'merge') ? Utils.uuid() : songM.id;

        if(mode === 'merge'){
          const existing = await DB.getSong(songM.id);
          if(existing){
            processed++;
            UIModule.updateProgress(processed, total);
            continue;
          }
        }

        const pages = [];
        const fileCache = new Map();

        for(const pageM of songM.pages){
          if(pageM.missing || !pageM.zipPath){
            missingFiles++;
            missingReport.push(`${songM.title} - 第${(pageM.pageIndex||0)+1}页`);
            continue;
          }

          const zipFile = zip.file('songs/'+pageM.zipPath);
          if(!zipFile){
            missingFiles++;
            missingReport.push(`${songM.title} - ${pageM.fileName||'未知文件'}`);
            continue;
          }

          let fileId = fileCache.get(pageM.zipPath);
          if(!fileId){
            fileId = Utils.uuid();
            fileCache.set(pageM.zipPath, fileId);

            const blob = await zipFile.async('blob');
            const fileRecord = {
              fileId,
              songId,
              name: pageM.fileName || pageM.zipPath.split('/').pop(),
              mimeType: pageM.mimeType || 'application/octet-stream',
              blob,
              size: blob.size,
              hash: 'restored_' + fileId,
            };
            await DB.saveFile(fileRecord);
          }

          pages.push({
            type: pageM.type,
            fileId,
            pageIndex: pageM.pageIndex || 0,
          });
        }

        if(pages.length > 0){
          const song = {
            id: songId,
            title: songM.title,
            artist: songM.artist,
            tags: songM.tags || [],
            key: songM.key || '',
            capo: songM.capo || 0,
            note: songM.note || '',
            favorite: songM.favorite || false,
            createdAt: songM.createdAt || Date.now(),
            lastOpenedAt: songM.lastOpenedAt || 0,
            pages,
          };
          await DB.saveSong(song);
          importedSongs++;
        }

        processed++;
        UIModule.updateProgress(processed, total);
        if(processed % 5 === 0) await new Promise(r=>setTimeout(r,0));
      }

      UIModule.hideProgress();
      let msg = `恢复完成：导入 ${importedSongs} 首歌曲`;
      if(missingFiles > 0) msg += `，${missingFiles} 个文件缺失`;
      Utils.toast(msg, missingFiles > 0 ? 'warning' : 'success', 5000);

      State._restoreManifest = null;
      State._restoreZip = null;
      await LibraryModule.refresh();
    }catch(err){
      UIModule.hideProgress();
      Utils.toast('恢复失败：'+err.message,'error',5000);
      console.error(err);
    }
  },
};

/* ==================== UI 模块 ==================== */
const UIModule = {

  // 统一处理侧栏开合；persist=false 时只改界面不写偏好（例如移动端启动时默认收起）
  applySidebarState(collapsed, persist){
    State.sidebarCollapsed = collapsed;
    document.getElementById('sidebar').classList.toggle('collapsed', collapsed);
    UIModule.syncSidebarBackdrop();
    if(persist !== false) localStorage.setItem('gsr_sidebarCollapsed', collapsed);
    setTimeout(()=>RenderModule.handleResize(), 300);
  },

  toggleSidebar(){
    UIModule.applySidebarState(!State.sidebarCollapsed);
  },

  // 移动端侧栏是浮层，需要有遮罩；桌面端永远不显示遮罩
  syncSidebarBackdrop(){
    const backdrop = document.getElementById('sidebar-backdrop');
    if(!backdrop) return;
    const mobile = window.innerWidth <= 768;
    backdrop.classList.toggle('show', mobile && !State.sidebarCollapsed);
  },

  // 移动端选完歌后收起侧栏，把屏幕让给谱面
  closeSidebarOnMobile(){
    if(window.innerWidth <= 768 && !State.sidebarCollapsed){
      UIModule.applySidebarState(true, false);
    }
  },

  updateToolbar(){
    const titleEl = document.getElementById('current-title');
    const starEl = document.getElementById('current-star');
    const keyEl = document.getElementById('key-info');
    const capoEl = document.getElementById('capo-info');

    if(State.currentSong){
      titleEl.textContent = State.currentSong.title;
      starEl.textContent = State.currentSong.favorite ? '★' : '☆';
      starEl.style.color = State.currentSong.favorite ? 'var(--star)' : '';

      if(State.currentSong.key){
        keyEl.textContent = 'Key: ' + State.currentSong.key;
        keyEl.style.display = '';
      } else keyEl.style.display = 'none';

      if(State.currentSong.capo && State.currentSong.capo > 0){
        capoEl.textContent = 'Capo: ' + State.currentSong.capo + '品';
        capoEl.style.display = '';
      } else capoEl.style.display = 'none';
    } else {
      titleEl.textContent = '未选择歌曲';
      starEl.textContent = '☆';
      starEl.style.color = '';
      keyEl.style.display = 'none';
      capoEl.style.display = 'none';
    }
  },

  updateStatusBar(){
    const info = document.getElementById('page-info');
    const progressFill = document.getElementById('status-progress-fill');
    const prevBtn = document.getElementById('prev-song-btn');
    const nextBtn = document.getElementById('next-song-btn');

    if(!State.currentSong){
      info.textContent = State.songs.length > 0 ? `曲库共 ${State.songs.length} 首歌曲` : '未选择歌曲';
      progressFill.style.width = '0%';
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      return;
    }

    const totalPages = State.currentSong.pages.length;
    const startPage = State.currentScreen * State.pagesPerScreen + 1;
    const endPage = Math.min(startPage + State.pagesPerScreen - 1, totalPages);
    const totalScreens = Math.max(1, Math.ceil(totalPages / State.pagesPerScreen));

    info.innerHTML = `<strong>${State.currentSong.title}</strong> · 第 ${startPage}-${endPage} 页 / 共 ${totalPages} 页 · 屏 ${State.currentScreen+1}/${totalScreens}`;
    progressFill.style.width = ((State.currentScreen+1) / totalScreens * 100) + '%';

    const filtered = LibraryModule.getFilteredSongs();
    const idx = filtered.findIndex(s=>s.id === State.currentSong.id);
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= filtered.length - 1;
  },

  showModal(html){
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal');
    modal.innerHTML = html;
    overlay.classList.add('show');
  },

  closeModal(){
    document.getElementById('modal-overlay').classList.remove('show');
  },

  showProgress(title){
    document.getElementById('progress-title').textContent = title;
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('progress-text').textContent = '0 / 0';
    document.getElementById('progress-overlay').classList.add('show');
  },

  hideProgress(){
    document.getElementById('progress-overlay').classList.remove('show');
  },

  updateProgress(current, total){
    const pct = total > 0 ? (current / total * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${current} / ${total}`;
  },

  updateProgressTitle(title){
    document.getElementById('progress-title').textContent = title;
  },

  // 【修复4】皮肤切换。silent=true 用于启动时恢复上次的主题，不再弹"已切换皮肤"
  setTheme(theme, silent){
    State.theme = theme;
    if(theme === 'dark'){
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    document.querySelectorAll('.theme-btn').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.theme === theme);
    });
    localStorage.setItem('gsr_theme', theme);
    if(!silent) Utils.toast('已切换皮肤', 'info', 1000);
  },

  loadTheme(){
    const saved = localStorage.getItem('gsr_theme') || 'dark';
    UIModule.setTheme(saved, true);
  },

  showFirstTimeGuide(){
    if(State.songs.length === 0){
      document.getElementById('empty-state').style.display = 'flex';
    }
  },

  checkBackupReminder(){
    const lastBackup = localStorage.getItem('gsr_lastBackup');
    if(!lastBackup && State.songs.length > 0){
      Utils.toast('提示：建议定期备份曲库','info',4000);
    } else if(lastBackup){
      const days = (Date.now() - parseInt(lastBackup)) / 86400000;
      if(days > 30){
        Utils.toast('已超过30天未备份，建议尽快备份','warning',4000);
      }
    }
  },
};

/* ==================== 快捷键模块 ==================== */
const Shortcuts = {
  handleKeyDown(e){
    // 焦点在输入框时快捷键失效
    const tag = e.target.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'){
      if(e.key === 'Escape') e.target.blur();
      return;
    }

    // 进度遮罩期间屏蔽全部快捷键，避免在弹层背后误操作
    const progress = document.getElementById('progress-overlay');
    if(progress && progress.classList.contains('show')) return;

    // 模态框打开时只响应 Esc，否则 '1'/'n'/'b' 会在弹窗背后换页换歌
    const modalOverlay = document.getElementById('modal-overlay');
    if(modalOverlay && modalOverlay.classList.contains('show')){
      if(e.key === 'Escape') UIModule.closeModal();
      return;
    }

    switch(e.key){
      case 'ArrowRight': case 'PageDown':
        e.preventDefault();
        PagingModule.nextScreen();
        break;
      case 'ArrowLeft': case 'PageUp':
        e.preventDefault();
        PagingModule.prevScreen();
        break;
      case ' ':
        e.preventDefault();
        PagingModule.handleSpacebar();
        break;
      case '1': case '2': case '3': case '4': case '6':
        e.preventDefault();
        RenderModule.setPagesPerScreen(parseInt(e.key));
        break;
      case 'f': case 'F':
        e.preventDefault();
        RenderModule.toggleFullscreen();
        break;
      case 'Escape':
        if(document.fullscreenElement) document.exitFullscreen();
        else UIModule.closeModal();
        break;
      case 's': case 'S':
        e.preventDefault();
        document.getElementById('search-input').focus();
        break;
      case 'i': case 'I':
        e.preventDefault();
        if(State.currentSong) LibraryModule.editSong(State.currentSong.id);
        break;
      case 'n': case 'N':
        e.preventDefault();
        PagingModule.nextSong();
        break;
      case 'b': case 'B':
        e.preventDefault();
        PagingModule.prevSong();
        break;
    }
  },
};

/* ==================== 触屏支持 ==================== */
const Touch = {
  startX:0, startY:0, startTime:0,

  handleTouchStart(e){
    if(e.touches.length !== 1) return;
    Touch.startX = e.touches[0].clientX;
    Touch.startY = e.touches[0].clientY;
    Touch.startTime = Date.now();
  },

  handleTouchEnd(e){
    if(e.changedTouches.length !== 1) return;
    // 宽排模式下横向滑动是用来滚谱面的，不要再同时触发切屏
    if(State.hScrollable) return;
    const dx = e.changedTouches[0].clientX - Touch.startX;
    const dy = e.changedTouches[0].clientY - Touch.startY;
    const dt = Date.now() - Touch.startTime;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if(absDx > 50 && absDx > absDy * 1.5){
      if(dx > 0) PagingModule.prevScreen();
      else PagingModule.nextScreen();
      return;
    }

    if(dt < 300 && absDx < 10 && absDy < 10){
      const x = e.changedTouches[0].clientX;
      const w = window.innerWidth;
      if(x < w / 3) PagingModule.prevScreen();
      else if(x > w * 2 / 3) PagingModule.nextScreen();
    }
  },
};

/* ==================== 初始化模块 ==================== */
const App = {

  // 只观察依赖加载结果用于提示，不阻塞任何启动步骤
  watchDeps(){
    const p = window.__depsReady;
    if(!p || !p.then) return;
    p.then(()=>{
      if(typeof pdfjsLib === 'undefined'){
        Utils.toast('PDF 组件未能加载（网络不通或 CDN 被拦截），PDF 功能暂不可用；图片功能不受影响','warning',7000);
      }
      if(typeof JSZip === 'undefined'){
        Utils.toast('JSZip 未能加载，备份与恢复功能暂不可用','warning',7000);
      }
    }).catch(()=>{});
  },

  async init(){
    // 依赖加载绝不阻塞启动：CDN 挂起时也必须先把界面、数据库、事件绑定都准备好。
    // PDF 能力由 PdfLib.get() 在真正需要时按需等待，自带超时。
    App.watchDeps();

    // 加载皮肤
    UIModule.loadTheme();

    // 初始化数据库
    try{
      await DB.init();
    }catch(err){
      Utils.toast('数据库初始化失败：'+err.message,'error',5000);
      return;
    }

    // 加载界面偏好（旧版本存下的值可能越界，这里统一校验一遍）
    const pps = parseInt(localStorage.getItem('gsr_pagesPerScreen'));
    if([1,2,3,4,6].includes(pps)) State.pagesPerScreen = pps;
    const savedTimer = parseInt(localStorage.getItem('gsr_timerInterval'));
    if(isFinite(savedTimer)) State.timedPaging.interval = Utils.clamp(savedTimer, PagingModule.TIMER_MIN, PagingModule.TIMER_MAX);
    // 定时翻页间隔输入框回填
    const timerInput = document.getElementById('timer-interval-input');
    if(timerInput){
      timerInput.value = State.timedPaging.interval;
      timerInput.min = PagingModule.TIMER_MIN;
      timerInput.max = PagingModule.TIMER_MAX;
    }

    // 排序偏好必须在这里读：refresh() 内部就会渲染列表，
    // 放到 bindEvents 里才读会导致首次加载的排序不生效
    const savedSort = localStorage.getItem('gsr_sortBy');
    if(savedSort) State.sortBy = savedSort;
    const sortSelect = document.getElementById('sort-select');
    if(sortSelect) sortSelect.value = State.sortBy;

    const savedSidebar = localStorage.getItem('gsr_sidebarCollapsed');
    if(savedSidebar === 'true'){
      State.sidebarCollapsed = true;
      document.getElementById('sidebar').classList.add('collapsed');
    }
    // 移动端默认收起侧栏（只改界面，不覆盖桌面端偏好）
    if(window.innerWidth <= 768 && !State.sidebarCollapsed){
      UIModule.applySidebarState(true, false);
    }

    // 更新工具栏按钮状态
    document.querySelectorAll('#pages-count-group button').forEach(b=>{
      b.classList.toggle('active', parseInt(b.dataset.count) === State.pagesPerScreen);
    });

    // 加载曲库
    await LibraryModule.refresh();

    // 恢复上次浏览位置
    const lastSongId = localStorage.getItem('gsr_lastSongId');
    const lastScreen = localStorage.getItem('gsr_lastScreen');
    if(lastSongId){
      const song = await DB.getSong(lastSongId);
      if(song){
        await PagingModule.openSong(lastSongId, lastScreen ? parseInt(lastScreen) : 0);
      }
    }

    // 显示引导
    UIModule.showFirstTimeGuide();
    UIModule.checkBackupReminder();

    // 绑定事件
    App.bindEvents();
  },

  bindEvents(){
    // 文件输入
    document.getElementById('file-input').addEventListener('change', e=>ImportModule.handleFileInput(e));
    document.getElementById('folder-input').addEventListener('change', e=>ImportModule.handleFileInput(e));
    document.getElementById('restore-input').addEventListener('change', e=>BackupModule.handleRestore(e));
    document.getElementById('append-input').addEventListener('change', e=>ImportModule.handleAppend(e));

    // 搜索
    document.getElementById('search-input').addEventListener('input', Utils.debounce(e=>{
      State.searchQuery = e.target.value;
      LibraryModule.renderSongList();
    }, 200));

    // 排序（偏好的读取已提前到 App.init，这里只负责响应变化）
    document.getElementById('sort-select').addEventListener('change', e=>{
      State.sortBy = e.target.value;
      localStorage.setItem('gsr_sortBy', State.sortBy);
      LibraryModule.renderSongList();
    });

    // 曲库列表 / 标签栏：事件委托，替代逐条拼内联 onclick
    document.getElementById('song-list').addEventListener('click', e=>LibraryModule.handleListClick(e));
    document.getElementById('tag-bar').addEventListener('click', e=>LibraryModule.handleTagClick(e));

    // 拖拽
    const displayArea = document.getElementById('display-area');
    const emptyState = document.getElementById('empty-state');

    displayArea.addEventListener('dragover', e=>{
      e.preventDefault();
      displayArea.classList.add('drag-over');
    });
    displayArea.addEventListener('dragleave', e=>{
      if(e.target === displayArea) displayArea.classList.remove('drag-over');
    });
    displayArea.addEventListener('drop', e=>ImportModule.handleDrop(e));

    if(emptyState){
      emptyState.addEventListener('dragover', e=>{
        e.preventDefault();
        emptyState.classList.add('drag-over');
      });
      // 没有 dragleave 会把高亮留在界面上（拖进来又移走但不松手）
      emptyState.addEventListener('dragleave', e=>{
        if(e.target === emptyState) emptyState.classList.remove('drag-over');
      });
      emptyState.addEventListener('drop', e=>ImportModule.handleDrop(e));
    }

    // 滚轮：宽排模式下把纵向滚轮转成横向滚动
    displayArea.addEventListener('wheel', e=>RenderModule.handleWheel(e), {passive:false});

    // 窗口尺寸变化
    window.addEventListener('resize', ()=>RenderModule.handleResize());

    /* 全屏变化：
       1. 隐藏/恢复上下工具条，把面积全给谱面
       2. 侧栏若处于展开状态一并收起，退出全屏时还原
       3. 可用高度变了必须重排（保留滚动位置，否则阅读进度会被打回屏首） */
    document.addEventListener('fullscreenchange', ()=>{
      const on = !!document.fullscreenElement;
      document.body.classList.toggle('fullscreen', on);

      let sidebarChanged = false;
      if(on && !State.sidebarCollapsed){
        State._sidebarWasOpen = true;
        UIModule.applySidebarState(true, false);   // 不写偏好，退出时还要还原
        sidebarChanged = true;
      } else if(!on && State._sidebarWasOpen){
        State._sidebarWasOpen = false;
        UIModule.applySidebarState(false, false);
        sidebarChanged = true;
      }

      if(on){
        Utils.toast('已进入全屏，按 Esc 或 F 退出','info',2500);
      }
      // 侧栏收放本身会触发布局重排（applySidebarState 内部安排了），避免重复渲染
      if(!sidebarChanged) setTimeout(()=>RenderModule.renderScreen({preserveScroll:true}), 100);
    });

    // 键盘快捷键
    document.addEventListener('keydown', e=>Shortcuts.handleKeyDown(e));

    // 触屏
    displayArea.addEventListener('touchstart', e=>Touch.handleTouchStart(e), {passive:true});
    displayArea.addEventListener('touchend', e=>Touch.handleTouchEnd(e), {passive:true});

    // 模态框点击外部关闭
    document.getElementById('modal-overlay').addEventListener('click', e=>{
      if(e.target.id === 'modal-overlay') UIModule.closeModal();
    });

    // 搜索框 Escape 退出
    document.getElementById('search-input').addEventListener('keydown', e=>{
      if(e.key === 'Escape') e.target.blur();
    });

    // 页面卸载前清理
    window.addEventListener('beforeunload', ()=>{
      RenderModule.cleanupAllResources();
    });
  },
};

/* 模块暴露给内联 onclick 使用。
   新增需要被 onclick 调用的模块时，记得同步加进这张表。
   （曲库列表与标签栏已改为事件委托，不再依赖内联 onclick） */
Object.assign(window, {
  Utils,
  DB,
  ImportModule,
  RenderModule,
  PagingModule,
  LibraryModule,
  BackupModule,
  UIModule,
});

// 启动
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', ()=>App.init());
} else {
  App.init();
}

})();
</script>
</body>
